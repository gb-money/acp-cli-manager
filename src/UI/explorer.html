<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Explorer - Project Root</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "error": "#ff716c", "surface-container": "#1a1a1a", "inverse-on-surface": "#565555", "on-primary-fixed-variant": "#006832", "primary-fixed": "#3fff8b", "on-tertiary-fixed-variant": "#005361", "on-error-container": "#ffa8a3", "on-tertiary": "#005360", "error-container": "#9f0519", "on-primary-fixed": "#004820", "on-secondary-container": "#bfd2e9", "on-primary-container": "#004f24", "outline": "#767575", "tertiary-container": "#00dcfd", "error-dim": "#d7383b", "surface-container-lowest": "#000000", "tertiary-dim": "#00cdec", "secondary-fixed-dim": "#bed1e7", "on-secondary-fixed-variant": "#485a6d", "secondary-container": "#36485b", "surface-dim": "#0e0e0e", "primary-container": "#13ea79", "on-error": "#490006", "secondary-dim": "#bed1e7", "surface-container-high": "#20201f", "on-background": "#ffffff", "surface-tint": "#3fff8b", "tertiary-fixed": "#00dcfd", "background": "#0e0e0e", "tertiary": "#7ae6ff", "surface": "#0e0e0e", "on-surface": "#ffffff", "surface-variant": "#262626", "surface-container-low": "#131313", "secondary": "#ccdff6", "inverse-primary": "#006e35", "primary-fixed-dim": "#24f07e", "primary-dim": "#24f07e", "on-tertiary-fixed": "#00343d", "inverse-surface": "#fcf9f8", "outline-variant": "#484847", "surface-bright": "#2c2c2c", "on-primary": "#005d2c", "on-secondary": "#3e5063", "surface-container-highest": "#262626", "on-secondary-fixed": "#2b3d4f", "secondary-fixed": "#ccdff6", "on-surface-variant": "#adaaaa", "on-tertiary-container": "#004955", "primary": "#3fff8b"
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                    fontFamily: { "headline": ["Manrope", "sans-serif"], "body": ["Inter", "sans-serif"], "label": ["Inter", "sans-serif"] }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism-tomorrow.min.css">
    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #444; }
        aside { transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1); overflow-x: hidden; }
        aside.collapsed { width: 4.5rem; }
        aside.collapsed .sidebar-label, aside.collapsed .sidebar-header { display: none; }
        aside.collapsed nav a { justify-content: center; padding-left: 4px; padding-right: 0; }
        aside.collapsed nav a span.material-symbols-outlined { font-size: 1.5rem; }
        #main-container { display: flex; flex: 1; overflow: hidden; }
        #explorer-main { transition: flex 0.3s ease; flex: 1; min-width: 0; }
        #explorer-main.split { border-right: 1px solid rgba(72, 72, 71, 0.2); }
        #preview-pane { flex: 0 0 30%; max-width: 30%; min-width: 30%; display: none; flex-direction: column; background: #0e0e0e; overflow: hidden; }
        #preview-pane.active { display: flex; }
        pre[class*="language-"] { margin: 0 !important; padding: 1rem !important; background: transparent !important; font-size: 0.75rem !important; white-space: pre-wrap !important; word-break: break-all !important; }
    </style>
</head>
<body class="bg-background text-on-surface font-body overflow-hidden h-screen flex flex-col">
    <header class="dark:bg-zinc-950/60 backdrop-blur-xl docked full-width top-0 shadow-lg shadow-black/20 flex justify-between items-center w-full px-6 h-16 z-50 shrink-0">
        <div class="flex items-center gap-6"><h1 class="text-xl font-bold text-white tracking-tighter font-headline">Explorer</h1></div>
        <div class="flex items-center gap-4 flex-1 justify-end max-w-md">
            <div class="relative w-full max-w-xs flex-1">
                <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-sm">search</span>
                <input id="search-input" oninput="window.ACP_EXPLORER.search(this.value)" class="w-full bg-surface-container-lowest border border-outline-variant/20 rounded-full py-1.5 pl-9 pr-4 text-sm focus:outline-none focus:border-primary text-on-surface placeholder:text-on-surface-variant transition-colors" placeholder="Search Files..." type="text"/>
            </div>
        </div>
    </header>
    <div class="h-12 bg-surface-container-low flex items-center px-4 gap-2 border-b border-surface-container z-40 relative shrink-0">
        <div class="flex items-center gap-1 mr-4">
            <button onclick="window.ACP_EXPLORER.toggleSidebar()" class="p-1.5 rounded hover:bg-surface-variant text-on-surface-variant hover:text-on-surface transition-colors"><span class="material-symbols-outlined text-xl">menu</span></button>
            <button id="btn-back" onclick="window.ACP_EXPLORER.goBack()" class="p-1.5 rounded hover:bg-surface-variant text-on-surface-variant hover:text-on-surface transition-colors disabled:opacity-30 disabled:cursor-not-allowed"><span class="material-symbols-outlined text-xl">arrow_back</span></button>
            <button id="btn-forward" onclick="window.ACP_EXPLORER.goForward()" class="p-1.5 rounded hover:bg-surface-variant text-on-surface-variant hover:text-on-surface transition-colors disabled:opacity-30 disabled:cursor-not-allowed"><span class="material-symbols-outlined text-xl">arrow_forward</span></button>
            <button id="btn-up" onclick="window.ACP_EXPLORER.goUp()" class="p-1.5 rounded hover:bg-surface-variant text-on-surface-variant hover:text-on-surface transition-colors"><span class="material-symbols-outlined text-xl">arrow_upward</span></button>
        </div>
        <div class="flex-1 bg-surface-container-lowest rounded-md border border-outline-variant/20 flex items-center px-3 h-8 text-sm overflow-hidden">
            <span class="material-symbols-outlined text-on-surface-variant mr-2 text-lg">folder</span>
            <div id="current-path-display" class="text-on-surface font-medium truncate">Project Root</div>
        </div>
    </div>
    <div id="main-container">
        <aside id="sidebar" class="dark:bg-zinc-950/40 backdrop-blur-2xl w-64 flex flex-col gap-2 pt-4 flex-shrink-0 overflow-y-auto border-r border-surface-container relative z-30">
            <nav class="flex-1 font-manrope text-xs font-semibold uppercase tracking-widest">
                <a class="border-l-4 border-[#3fff8b] bg-zinc-800/40 text-white font-bold py-3 px-4 flex items-center gap-3 hover:bg-zinc-800/60 transition-colors" href="#"><span class="material-symbols-outlined text-lg" style="font-variation-settings: 'FILL' 1;">desktop_windows</span><span class="sidebar-label">Workspace</span></a>
            </nav>
        </aside>
        <main id="explorer-main" class="bg-surface-container-low p-6 overflow-y-auto relative z-20">
            <div class="mb-8 flex justify-between items-end border-b border-surface-container pb-4">
                <div><h2 id="main-title" class="text-2xl font-headline font-bold text-on-surface tracking-tight truncate max-w-xl">Project Root</h2><p id="main-subtitle" class="text-on-surface-variant text-xs mt-1">Local Development Environment</p></div>
                <div class="flex gap-2 bg-surface-container-lowest p-1 rounded-lg border border-outline-variant/20">
                    <button id="view-toggle-grid" onclick="window.ACP_EXPLORER.switchView('grid')" class="p-2 rounded bg-surface-variant text-on-surface shadow-md"><span class="material-symbols-outlined text-sm">grid_view</span></button>
                    <button id="view-toggle-list" onclick="window.ACP_EXPLORER.switchView('list')" class="p-2 rounded text-on-surface-variant hover:text-on-surface transition-colors"><span class="material-symbols-outlined text-sm">view_list</span></button>
                </div>
            </div>
            <div id="explorer-grid-view" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-6 gap-6"></div>
            <div id="explorer-list-view" class="hidden w-full overflow-hidden rounded-lg border border-outline-variant/10 bg-surface-container-high shadow-lg">
                <table class="w-full text-left font-body text-sm border-collapse">
                    <thead class="bg-surface-container-low border-b border-outline-variant/20 text-on-surface-variant text-xs uppercase tracking-wider font-semibold font-headline">
                        <tr>
                            <th class="px-6 py-4 w-12 text-center"><input type="checkbox" id="check-all" onclick="window.ACP_EXPLORER.toggleAll(this.checked)" class="rounded border-outline-variant/30 bg-surface-container-lowest text-primary"/></th>
                            <th class="px-6 py-4 cursor-pointer hover:text-on-surface" onclick="window.ACP_EXPLORER.sortBy('name')">Name</th>
                            <th class="px-6 py-4 cursor-pointer hover:text-on-surface" onclick="window.ACP_EXPLORER.sortBy('date')">Date</th>
                            <th class="px-6 py-4 cursor-pointer hover:text-on-surface" onclick="window.ACP_EXPLORER.sortBy('type')">Type</th>
                            <th class="px-6 py-4 text-right cursor-pointer hover:text-on-surface" onclick="window.ACP_EXPLORER.sortBy('size')">Size</th>
                        </tr>
                    </thead>
                    <tbody id="explorer-list-body" class="divide-y divide-outline-variant/10 text-on-surface"></tbody>
                </table>
            </div>
        </main>
        <section id="preview-pane" class="relative shrink-0">
            <header class="h-12 flex items-center justify-between px-4 border-b border-outline-variant/10 bg-surface-container-low shrink-0"><span id="preview-filename" class="text-xs font-semibold text-on-surface truncate">Preview</span><button onclick="window.ACP_EXPLORER.closePreview()" class="p-1 rounded hover:bg-surface-variant text-on-surface-variant"><span class="material-symbols-outlined text-sm">close</span></button></header>
            <div id="preview-content" class="flex-1 overflow-auto bg-[#0e0e0e]"><pre id="preview-code" class="line-numbers"><code id="preview-code-element"></code></pre></div>
        </section>
    </div>
    <footer class="dark:bg-zinc-950 h-10 border-t border-zinc-800/20 flex justify-between items-center px-6 shrink-0"><div id="status-bar-info" class="font-inter text-[11px] font-medium text-zinc-400">0 items</div><button onclick="window.ACP_EXPLORER.refresh()" class="font-inter text-[11px] font-medium text-zinc-500 hover:text-white transition-colors">Refresh</button></footer>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-pascal.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-typescript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-json.min.js"></script>
    <script>
        const Explorer = {
            currentPath: '', currentView: 'grid', currentData: [], historyStack: [], forwardStack: [], sortKey: 'name', sortOrder: 'asc', selectedPath: null, searchQuery: '',
            updateFileList(json) {
                const data = typeof json === 'string' ? JSON.parse(json) : json;
                this.currentData = (data.files || []).map(f => ({ ...f, selected: false }));
                const newPath = data.currentPath || (this.currentData.length > 0 ? this.currentData[0].path.split(/[\\\/]/).slice(0,-1).join('\\') : '');
                if (newPath && newPath !== this.currentPath) { if (this.currentPath) this.historyStack.push(this.currentPath); this.currentPath = newPath; this.forwardStack = []; }
                this.updateUI(); this.render();
            },
            updateUI() {
                document.getElementById('current-path-display').innerText = this.currentPath || 'Project Root';
                document.getElementById('main-title').innerText = this.currentPath ? this.currentPath.split(/[\\\/]/).pop() : 'Project Root';
                document.getElementById('btn-back').disabled = this.historyStack.length === 0;
                document.getElementById('btn-forward').disabled = this.forwardStack.length === 0;
            },
            goBack() { if (this.historyStack.length === 0) return; this.forwardStack.push(this.currentPath); this.navigateTo(this.historyStack.pop(), true); },
            goForward() { if (this.forwardStack.length === 0) return; this.historyStack.push(this.currentPath); this.navigateTo(this.forwardStack.pop(), true); },
            goUp() { if (!this.currentPath) return; const parent = this.currentPath.split(/[\\\/]/).slice(0, -1).join('\\'); if (parent) this.navigateTo(parent); },
            navigateTo(path, silent = false) { window.location.href = `explorer-action://open?path=${encodeURIComponent(path)}&isDir=true${silent ? '&noHistory=true' : ''}`; },
            switchView(view) {
                this.currentView = view;
                document.getElementById('explorer-grid-view').classList.toggle('hidden', view !== 'grid');
                document.getElementById('explorer-list-view').classList.toggle('hidden', view !== 'list');
                document.getElementById('view-toggle-grid').className = view === 'grid' ? 'p-2 rounded bg-surface-variant text-on-surface shadow-md' : 'p-2 rounded text-on-surface-variant hover:text-on-surface transition-colors';
                document.getElementById('view-toggle-list').className = view === 'list' ? 'p-2 rounded bg-surface-variant text-on-surface shadow-md' : 'p-2 rounded text-on-surface-variant hover:text-on-surface transition-colors';
            },
            search(query) { this.searchQuery = query.toLowerCase(); this.render(); },
            render() {
                const gridContainer = document.getElementById('explorer-grid-view'); const listBody = document.getElementById('explorer-list-body');
                gridContainer.innerHTML = ''; listBody.innerHTML = '';
                const filtered = this.currentData.filter(f => f.name.toLowerCase().includes(this.searchQuery));
                filtered.sort((a, b) => { if (a.isDir !== b.isDir) return a.isDir ? -1 : 1; return this.sortOrder === 'asc' ? a.name.localeCompare(b.name) : b.name.localeCompare(a.name); })
                .forEach(item => {
                    const isSel = item.path === this.selectedPath;
                    const gItem = document.createElement('div');
                    gItem.className = `group flex flex-col items-center gap-3 p-3 rounded-xl transition-colors cursor-pointer ${isSel ? 'bg-surface-container-high ring-1 ring-primary/40' : 'hover:bg-surface-container-high'}`;
                    gItem.onclick = (e) => this.onItemClick(item, e); gItem.ondblclick = () => this.navigateTo(item.path);
                    gItem.innerHTML = `<div class="w-16 h-16 bg-surface-container-highest rounded-lg flex items-center justify-center shadow-lg border border-outline-variant/10 group-hover:-translate-y-1 transition-all"><span class="material-symbols-outlined text-4xl ${item.isDir ? 'text-primary' : 'text-tertiary-fixed-dim'}" style="font-variation-settings: 'FILL' 1;">${item.isDir ? 'folder' : 'description'}</span></div><span class="text-xs font-medium text-center truncate w-full">${item.name}</span>`;
                    gridContainer.appendChild(gItem);
                    const row = document.createElement('tr');
                    row.className = `hover:bg-surface-container-highest transition-colors cursor-pointer ${isSel ? 'bg-surface-container-highest border-l-4 border-primary' : 'border-l-4 border-transparent'}`;
                    row.onclick = (e) => this.onItemClick(item, e); row.ondblclick = () => this.navigateTo(item.path);
                    row.innerHTML = `<td class="px-6 py-3 text-center"><input type="checkbox" class="rounded border-outline-variant/30 bg-surface-container-lowest text-primary"/></td><td class="px-6 py-3"><div class="flex items-center gap-3"><span class="material-symbols-outlined ${item.isDir ? 'text-primary' : 'text-secondary'}" style="font-variation-settings: 'FILL' 1;">${item.isDir ? 'folder' : 'description'}</span><span>${item.name}</span></div></td><td class="px-6 py-3 text-xs opacity-60">${item.date}</td><td class="px-6 py-3 text-xs opacity-60">${item.type}</td><td class="px-6 py-3 text-right text-xs opacity-60">${item.size || '--'}</td>`;
                    listBody.appendChild(row);
                });
                document.getElementById('status-bar-info').innerText = `${filtered.length} items`;
            },
            onItemClick(item, e) {
                this.selectedPath = item.path; this.render();
                if (!item.isDir) {
                    document.getElementById('explorer-main').classList.add('split');
                    document.getElementById('preview-pane').classList.add('active');
                    document.getElementById('preview-filename').innerText = item.name;
                    window.location.href = `explorer-action://get-preview?path=${encodeURIComponent(item.path)}`;
                }
            },
            setPreviewContent(content, ext) {
                const codeEl = document.getElementById('preview-code-element');
                const langMap = { 'pas': 'pascal', 'ts': 'typescript', 'json': 'json', 'js': 'javascript' };
                codeEl.className = `language-${langMap[ext] || 'clike'}`; codeEl.textContent = content; Prism.highlightElement(codeEl);
            },
            closePreview() { document.getElementById('explorer-main').classList.remove('split'); document.getElementById('preview-pane').classList.remove('active'); this.selectedPath = null; this.render(); },
            toggleSidebar() { document.getElementById('sidebar').classList.toggle('collapsed'); },
            refresh() { window.location.href = `explorer-action://refresh`; },
            sortBy(key) { if (this.sortKey === key) this.sortOrder = this.sortOrder === 'asc' ? 'desc' : 'asc'; else { this.sortKey = key; this.sortOrder = 'asc'; } this.render(); },
            toggleAll(checked) { /* Logic for bulk selection */ }
        };
        window.ACP_EXPLORER = Explorer;
        window.addEventListener('mousedown', (e) => {
            if (e.button === 3) { e.preventDefault(); window.ACP_EXPLORER.goBack(); }
            else if (e.button === 4) { e.preventDefault(); window.ACP_EXPLORER.goForward(); }
        });
    </script>
</body>
</html>
