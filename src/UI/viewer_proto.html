<!DOCTYPE html>
<html class="dark" lang="ko">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>ACP Viewer & Diff Prototype</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "background": "#0e0e0e",
                        "surface": "#0e0e0e",
                        "on-surface": "#ffffff",
                        "primary": "#3fff8b",
                        "error": "#ff716c",
                        "surface-container-highest": "#262626",
                        "surface-container-low": "#131313",
                        "outline-variant": "#484847",
                        "on-surface-variant": "#adaaaa",
                    },
                    fontFamily: {
                        mono: ["'Fira Code'", "monospace"],
                        headline: ["Manrope", "sans-serif"],
                        body: ["Inter", "sans-serif"]
                    }
                }
            }
        }
    </script>
    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-thumb { background: #262626; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #484847; }
        
        pre[class*="language-"] {
            margin: 0 !important;
            padding: 1.5rem !important;
            background: transparent !important;
        }
        code[class*="language-"] {
            font-family: 'Fira Code', monospace !important;
            font-size: 0.875rem !important;
        }
        
        .diff-row { display: grid; grid-template-columns: 3rem 1fr 3rem 1fr; border-bottom: 1px solid rgba(72, 72, 71, 0.1); }
        .diff-num { color: #484847; text-align: right; padding-right: 1rem; user-select: none; font-size: 0.75rem; border-right: 1px solid rgba(72, 72, 71, 0.2); }
        .diff-content { padding-left: 1rem; white-space: pre-wrap; word-break: break-all; font-family: 'Fira Code', monospace; font-size: 0.875rem; }
        .diff-added { background-color: rgba(63, 255, 139, 0.1); }
        .diff-removed { background-color: rgba(255, 113, 108, 0.1); text-decoration: line-through; opacity: 0.7; }
    </style>
    <!-- PrismJS Assets -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
</head>
<body class="bg-surface text-on-surface font-body h-screen flex flex-col overflow-hidden antialiased">
    
    <!-- Header -->
    <header class="h-14 flex items-center justify-between px-6 bg-surface/80 backdrop-blur-md border-b border-outline-variant/10 shrink-0">
        <div class="flex items-center gap-4">
            <span class="material-symbols-outlined text-primary text-xl">description</span>
            <div>
                <h2 id="fileName" class="font-headline font-semibold text-sm tracking-tight">Select a file</h2>
                <p id="filePath" class="text-[10px] text-on-surface-variant font-mono">No file selected</p>
            </div>
        </div>
        <div class="flex items-center gap-2 bg-surface-container-low p-1 rounded-lg border border-outline-variant/20">
            <button onclick="ViewerAPI.setMode('view')" id="btnViewMode" class="px-3 py-1 text-xs font-medium rounded-md transition-all bg-primary text-on-surface/90 shadow-sm">Code View</button>
            <button onclick="ViewerAPI.setMode('diff')" id="btnDiffMode" class="px-3 py-1 text-xs font-medium rounded-md transition-all text-on-surface-variant hover:text-on-surface">Diff View</button>
        </div>
    </header>

    <!-- Content Area -->
    <main class="flex-1 overflow-hidden relative">
        <!-- Single File Viewer -->
        <div id="fileViewer" class="absolute inset-0 overflow-auto">
            <pre id="codeContainer" class="line-numbers"><code id="codeElement" class="language-pascal"></code></pre>
        </div>

        <!-- Diff Viewer -->
        <div id="diffViewer" class="absolute inset-0 overflow-auto hidden">
            <div class="min-w-[800px]">
                <div class="sticky top-0 grid grid-cols-[3rem_1fr_3rem_1fr] bg-surface-container-highest/90 backdrop-blur-sm border-b border-outline-variant/20 py-2 text-[10px] font-bold uppercase tracking-wider text-on-surface-variant z-10">
                    <div class="pl-4">OLD</div>
                    <div>Source (Original)</div>
                    <div class="pl-4">NEW</div>
                    <div>Modified (Agent)</div>
                </div>
                <div id="diffContent">
                    <!-- Rows will be injected here -->
                </div>
            </div>
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="absolute inset-0 flex flex-col items-center justify-center bg-surface z-20">
            <div class="w-16 h-16 rounded-2xl bg-surface-container-highest flex items-center justify-center border border-outline-variant/20 mb-4">
                <span class="material-symbols-outlined text-primary text-3xl">terminal</span>
            </div>
            <p class="text-sm text-on-surface-variant">Select a file from the explorer or test with buttons below.</p>
            <div class="mt-6 flex gap-3">
                <button onclick="ViewerAPI.testShowFile()" class="px-4 py-2 bg-surface-container-highest border border-outline-variant/30 rounded-xl text-xs hover:border-primary/50 transition-colors">Test File View</button>
                <button onclick="ViewerAPI.testShowDiff()" class="px-4 py-2 bg-surface-container-highest border border-outline-variant/30 rounded-xl text-xs hover:border-primary/50 transition-colors">Test Diff View</button>
            </div>
        </div>
    </main>

    <!-- PrismJS Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-pascal.min.js"></script>
    
    <script>
        window.ViewerAPI = {
            currentMode: 'view',
            
            setMode: (mode) => {
                this.currentMode = mode;
                const v = document.getElementById('fileViewer');
                const d = document.getElementById('diffViewer');
                const bv = document.getElementById('btnViewMode');
                const bd = document.getElementById('btnDiffMode');
                
                if (mode === 'view') {
                    v.classList.remove('hidden'); d.classList.add('hidden');
                    bv.classList.add('bg-primary', 'text-on-surface/90'); bv.classList.remove('text-on-surface-variant');
                    bd.classList.remove('bg-primary', 'text-on-surface/90'); bd.classList.add('text-on-surface-variant');
                } else {
                    v.classList.add('hidden'); d.classList.remove('hidden');
                    bd.classList.add('bg-primary', 'text-on-surface/90'); bd.classList.remove('text-on-surface-variant');
                    bv.classList.remove('bg-primary', 'text-on-surface/90'); bv.classList.add('text-on-surface-variant');
                }
            },

            showFile: (filename, path, content, lang = 'pascal') => {
                document.getElementById('emptyState').classList.add('hidden');
                document.getElementById('fileName').innerText = filename;
                document.getElementById('filePath').innerText = path;
                
                const codeEl = document.getElementById('codeElement');
                codeEl.className = `language-${lang}`;
                codeEl.textContent = content;
                Prism.highlightElement(codeEl);
                ViewerAPI.setMode('view');
            },

            showDiff: (filename, path, diffData) => {
                document.getElementById('emptyState').classList.add('hidden');
                document.getElementById('fileName').innerText = filename + " (History)";
                document.getElementById('filePath').innerText = path;
                
                const container = document.getElementById('diffContent');
                container.innerHTML = '';
                
                diffData.forEach(row => {
                    const rowEl = document.createElement('div');
                    rowEl.className = `diff-row ${row.type === 'added' ? 'diff-added' : row.type === 'removed' ? 'diff-removed' : ''}`;
                    
                    rowEl.innerHTML = `
                        <div class="diff-num">${row.oldLine || ''}</div>
                        <div class="diff-content">${row.type === 'added' ? '' : ViewerAPI.escapeHtml(row.content)}</div>
                        <div class="diff-num">${row.newLine || ''}</div>
                        <div class="diff-content">${row.type === 'removed' ? '' : ViewerAPI.escapeHtml(row.content)}</div>
                    `;
                    container.appendChild(rowEl);
                });
                ViewerAPI.setMode('diff');
            },

            escapeHtml: (unsafe) => {
                return unsafe.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
            },

            // --- Test Functions ---
            testShowFile: () => {
                const sampleCode = `unit uMain;\n\ninterface\n\nuses\n  System.SysUtils, System.Types, FMX.Forms;\n\ntype\n  TForm1 = class(TForm)\n    procedure FormCreate(Sender: TObject);\n  end;\n\nimplementation\n\nprocedure TForm1.FormCreate(Sender: TObject);\nbegin\n  // Initializing application...\n  Log('App Started');\nend;\n\nend.`;
                ViewerAPI.showFile('uMain.pas', 'src/uMain.pas', sampleCode);
            },

            testShowDiff: () => {
                const dummyDiff = [
                    { oldLine: 1, newLine: 1, type: 'unchanged', content: 'unit uACPClient;' },
                    { oldLine: 2, newLine: 2, type: 'unchanged', content: '' },
                    { oldLine: 3, newLine: 3, type: 'unchanged', content: 'interface' },
                    { oldLine: 4, newLine: null, type: 'removed', content: 'uses System.SysUtils, System.Classes;' },
                    { oldLine: null, newLine: 4, type: 'added', content: 'uses' },
                    { oldLine: null, newLine: 5, type: 'added', content: '  System.SysUtils, System.Classes, System.JSON,' },
                    { oldLine: null, newLine: 6, type: 'added', content: '  JsonDataObjects; // Mandatory JSON Library' },
                    { oldLine: 5, newLine: 7, type: 'unchanged', content: '' },
                    { oldLine: 6, newLine: 8, type: 'unchanged', content: 'type' },
                    { oldLine: 7, newLine: 9, type: 'unchanged', content: '  TACPClient = class' },
                    { oldLine: 8, newLine: null, type: 'removed', content: '    procedure Connect(const AHost: string);' },
                    { oldLine: null, newLine: 10, type: 'added', content: '    function Connect(const AHost: string; APort: Integer): Boolean;' },
                    { oldLine: 9, newLine: 11, type: 'unchanged', content: '  end;' },
                    { oldLine: 10, newLine: 12, type: 'unchanged', content: '' },
                    { oldLine: 11, newLine: 13, type: 'unchanged', content: 'implementation' },
                    { oldLine: 12, newLine: 14, type: 'unchanged', content: '' },
                    { oldLine: 13, newLine: null, type: 'removed', content: 'procedure TACPClient.Connect(const AHost: string);' },
                    { oldLine: 14, newLine: null, type: 'removed', content: 'begin' },
                    { oldLine: 15, newLine: null, type: 'removed', content: '  // Old connection logic' },
                    { oldLine: 16, newLine: null, type: 'removed', content: 'end;' },
                    { oldLine: null, newLine: 15, type: 'added', content: 'function TACPClient.Connect(const AHost: string; APort: Integer): Boolean;' },
                    { oldLine: null, newLine: 16, type: 'added', content: 'begin' },
                    { oldLine: null, newLine: 17, type: 'added', content: '  Result := InternalConnect(AHost, APort);' },
                    { oldLine: null, newLine: 18, type: 'added', content: '  if Result then Log(\'Connected successfully\');' },
                    { oldLine: null, newLine: 19, type: 'added', content: 'end;' },
                    { oldLine: 17, newLine: 20, type: 'unchanged', content: '' },
                    { oldLine: 18, newLine: 21, type: 'unchanged', content: 'end.' }
                ];
                ViewerAPI.showDiff('uACPClient.pas', 'src/ACP/uACPClient.pas', dummyDiff);
            }
        };
    </script>
</body>
</html>
