<!DOCTYPE html>
<html class="dark" lang="en" style="color-scheme: dark;">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>ACP Dashboard</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL,GRAD,opsz@100..700,0..1,0,20..48" rel="stylesheet">
    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #262626; border-radius: 10px; }
    </style>
</head>
<body class="bg-surface text-on-surface font-body h-screen flex overflow-hidden antialiased">
    <div id="dashboardView" class="flex-1 overflow-y-auto">
        <header class="h-16 flex items-center px-8 bg-surface/80 backdrop-blur-md border-b border-outline-variant/10 shrink-0">
            <h2 class="font-headline font-semibold text-on-surface text-lg tracking-tight">System Dashboard</h2>
        </header>
        <div class="p-8 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="bg-surface-container-highest rounded-2xl p-6 border border-outline-variant/10 shadow-lg">
                <h4 class="text-xs font-bold text-on-surface-variant uppercase tracking-widest mb-4">Total Sessions</h4>
                <div class="text-4xl font-headline font-extrabold text-primary" id="dashTotalSessions">0</div>
            </div>
            <div class="bg-surface-container-highest rounded-2xl p-6 border border-outline-variant/10 shadow-lg">
                <h4 class="text-xs font-bold text-on-surface-variant uppercase tracking-widest mb-4">Active Agents</h4>
                <div class="text-4xl font-headline font-extrabold text-tertiary">1</div>
            </div>
        </div>
    </div>
</body>
</html>
