<!DOCTYPE html>
<html class="dark" lang="en" style="color-scheme: dark;">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>ACP Agents</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL,GRAD,opsz@100..700,0..1,0,20..48" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.2.0/github-markdown-dark.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #262626; border-radius: 10px; }
        .markdown-body { background: transparent !important; color: #e6edf3 !important; font-size: 0.9375rem !important; }
        .markdown-body pre { background: #0d1117 !important; border: 1px solid rgba(72, 72, 71, 0.5) !important; border-radius: 0.75rem !important; padding: 1rem !important; margin: 1rem 0 !important; overflow-x: auto; }
        .markdown-body code { font-family: 'Fira Code', monospace !important; color: #ffffff !important; }
        [contenteditable=true]:empty:before { content: attr(placeholder); pointer-events: none; color: rgba(173, 170, 170, 0.3); display: block; }
    </style>
</head>
<body class="bg-surface text-on-surface font-body h-screen flex overflow-hidden antialiased">
    <div id="chatView" class="flex-1 flex flex-col min-w-0">
        <header class="h-16 flex items-center justify-between px-8 bg-surface/80 backdrop-blur-md border-b border-outline-variant/10 shrink-0">
            <div class="flex items-center gap-4">
                <h2 class="font-headline font-semibold text-on-surface text-lg tracking-tight">Agent Conversation</h2>
                <div class="h-4 w-[1px] bg-outline-variant/30 hidden md:block"></div>
                <div class="flex flex-col gap-0.5 min-w-0">
                    <span id="activeAgentHeader" class="text-sm font-medium text-on-surface-variant truncate">No Session</span>
                    <span id="activeWorkspaceHeader" class="text-[10px] opacity-40 font-mono truncate ml-1"></span>
                </div>
            </div>
            <button onclick="window.parent.ACP.toggleHistory()" class="w-10 h-10 rounded-lg bg-surface-container-high flex items-center justify-center border border-outline-variant/20 shadow-lg">
                <span class="material-symbols-outlined text-on-surface-variant text-xl">side_navigation</span>
            </button>
        </header>

        <div class="flex-1 flex flex-row overflow-hidden relative">
            <div class="flex-1 flex flex-col min-w-0 bg-surface relative">
                <div id="mainChatCanvas" class="flex-1 overflow-y-auto px-4 md:px-8 py-8 space-y-8 scroll-smooth hidden"></div>
                
                <div id="mainEmptyArea" class="flex-1 flex flex-col items-center justify-center">
                    <div class="flex flex-col items-center gap-6 max-w-md text-center p-8">
                        <div class="w-20 h-20 rounded-3xl bg-surface-container-high flex items-center justify-center border border-outline-variant/20 shadow-2xl mb-2 animate-bounce">
                            <span class="material-symbols-outlined text-primary text-4xl">chat_bubble</span>
                        </div>
                        <h3 class="text-xl font-headline font-bold text-on-surface">Ready to start?</h3>
                        <p class="text-sm text-on-surface-variant">Select a session from the sidebar to begin.</p>
                    </div>
                </div>

                <div id="mainInputArea" class="shrink-0 p-4 md:p-8 border-t border-outline-variant/10 bg-surface/50 backdrop-blur-sm hidden">
                    <div class="max-w-4xl mx-auto">
                        <div class="flex items-center mb-3 px-1">
                            <button class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-surface-container-lowest border border-outline-variant/30 text-[11px] font-medium text-on-surface hover:bg-surface-container-high transition-colors shadow-sm">
                                <span class="material-symbols-outlined text-[16px] text-primary">smart_toy</span>
                                <span id="currentModelName">Auto</span>
                            </button>
                        </div>

                        <div class="relative bg-surface-container-lowest border border-outline-variant/30 rounded-2xl shadow-xl focus-within:border-primary/40 transition-all duration-300">
                            <div id="userInput" contenteditable="true" 
                                class="w-full bg-transparent text-on-surface border-none focus:ring-0 outline-none py-4 px-4 min-h-[60px] max-h-[160px] text-sm leading-relaxed overflow-y-auto" 
                                placeholder="Message Agent..."></div>
                            
                            <div class="flex items-center justify-between px-3 pb-3 pt-1 border-t border-outline-variant/5 mt-1">
                                <div class="flex items-center gap-1">
                                    <button onmousedown="event.preventDefault();" class="p-1.5 text-on-surface-variant hover:text-white rounded-lg"><span class="material-symbols-outlined text-[20px]">attach_file</span></button>
                                    <button onmousedown="event.preventDefault();" class="p-1.5 text-on-surface-variant hover:text-white rounded-lg"><span class="material-symbols-outlined text-[20px]">construction</span></button>
                                </div>
                                <button id="send-button" onclick="window.parent.ACP.sendMessage()" class="w-9 h-9 rounded-full bg-primary flex items-center justify-center text-on-primary hover:bg-primary-container shadow-lg active:scale-95 transition-all">
                                    <span class="material-symbols-outlined text-[20px]">send</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-pascal.min.js"></script>
    
    <script>
        // 부모(index.html)에서 호출할 내부 핸들러들
        window.ACP_INTERNAL = {
            lastAiMsgId: '',
            lastBlockType: '',
            lastMessageRole: '',

            updateSessionList: (sessions) => {
                const active = sessions.find(s => s.active);
                if (active) {
                    document.getElementById('activeAgentHeader').innerText = active.name;
                    document.getElementById('activeWorkspaceHeader').innerText = active.workspace || '';
                    document.getElementById('mainChatCanvas').classList.remove('hidden');
                    document.getElementById('mainEmptyArea').classList.add('hidden');
                    document.getElementById('mainInputArea').classList.remove('hidden');
                }
            },

            streamMessage: (data) => {
                const { content, role } = data;
                const canvas = document.getElementById('mainChatCanvas');
                const targetRole = role === 'user' ? 'me' : 'ai';
                
                if (window.ACP_INTERNAL.lastBlockType !== 'message' || window.ACP_INTERNAL.lastMessageRole !== targetRole) {
                    const divId = 'msg-' + Date.now();
                    const html = `<div class="flex ${targetRole==='me' ? 'justify-end' : 'justify-start'}"><div class="${targetRole==='me' ? 'bg-secondary-container' : 'bg-surface-container-highest'} p-4 rounded-xl max-w-[85%]" id="${divId}"></div></div>`;
                    canvas.insertAdjacentHTML('beforeend', html);
                    window.ACP_INTERNAL.lastAiMsgId = divId;
                    window.ACP_INTERNAL.lastBlockType = 'message';
                    window.ACP_INTERNAL.lastMessageRole = targetRole;
                }

                const targetDiv = document.getElementById(window.ACP_INTERNAL.lastAiMsgId);
                if (targetDiv) {
                    if (window.marked) targetDiv.innerHTML = marked.parse(content);
                    else targetDiv.innerText = content;
                }
                canvas.scrollTop = canvas.scrollHeight;
            },

            loadHistoryBase64: (base64) => {
                const binary = window.atob(base64);
                const bytes = new Uint8Array(binary.length);
                for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
                const json = new TextDecoder().decode(bytes);
                const messages = JSON.parse(json);
                
                const canvas = document.getElementById('mainChatCanvas');
                canvas.innerHTML = '';
                messages.forEach(msg => window.ACP_INTERNAL.streamMessage({content: msg.content, role: msg.role}));
            }
        };

        window.addEventListener('DOMContentLoaded', () => {
            const input = document.getElementById('userInput');
            if (input) {
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        const text = input.innerText.trim();
                        if (text) {
                            window.parent.sendAcp('acp-action://send-message?text=' + encodeURIComponent(text));
                            input.innerText = '';
                        }
                    }
                });
            }
        });
    </script>
</body>
</html>
