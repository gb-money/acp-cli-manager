<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>ACP Diff Viewer</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <!-- jsdiff library for diffing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsdiff/5.1.0/diff.min.js"></script>

    <script src="js/diff_view.tailwind.js"></script>
    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #262626; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #484847; }

        .diff-row { display: grid; grid-template-columns: 3.5rem 1fr 2rem 3.5rem 1fr; border-bottom: 1px solid rgba(72, 72, 71, 0.1); }
        .diff-num { color: #484847; text-align: right; padding-right: 1rem; user-select: none; font-size: 0.75rem; border-right: 1px solid rgba(72, 72, 71, 0.2); background: rgba(26, 26, 26, 0.3); }
        .diff-action { display: flex; align-items: center; justify-content: center; border-right: 1px solid rgba(72, 72, 71, 0.2); background: rgba(26, 26, 26, 0.1); }
        .diff-content { padding-left: 1rem; white-space: pre-wrap; word-break: break-all; font-family: 'Fira Code', monospace; font-size: 0.825rem; min-height: 1.5rem; line-height: 1.5rem; }
        .diff-added { background-color: rgba(63, 255, 139, 0.08); }
        .diff-added .diff-content { color: #3fff8b; }
        .diff-removed { background-color: rgba(255, 113, 108, 0.08); opacity: 0.8; }
        .diff-removed .diff-content { color: #ff716c; text-decoration: line-through; }
        .sticky-header { position: sticky; top: 0; z-index: 20; }
    </style>

    <script src="js/acp.shared.js"></script>
    <script src="js/diff_view.UI.js"></script>
</head>

<body class="bg-surface text-on-surface font-body h-screen flex overflow-hidden antialiased">
    <!-- Left SideNavBar (Sessions) -->
    <nav class="bg-surface-container-lowest/80 backdrop-blur-xl h-screen w-72 flex-shrink-0 flex flex-col z-50 border-r border-outline-variant/10">
        <div class="p-6 pb-4">
            <div class="flex items-center gap-3 mb-6">
                <span class="material-symbols-outlined text-primary text-xl">difference</span>
                <div>
                    <h1 class="font-headline font-bold text-lg tracking-tight text-on-surface leading-tight">Diff Viewer</h1>
                    <p class="text-xs font-label text-on-surface-variant">Version History</p>
                </div>
            </div>
        </div>
        <div id="sessionListContainer" class="flex-1 overflow-y-auto px-3 space-y-1 pb-6"></div>
    </nav>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col min-w-0 bg-surface relative z-0">
        <!-- Header -->
        <header class="h-14 flex items-center justify-between px-6 bg-surface/80 backdrop-blur-md border-b border-outline-variant/10 shrink-0">
            <div class="flex items-center gap-4">
                <div>
                    <h2 id="fileName" class="font-headline font-semibold text-sm tracking-tight">Compare Changes</h2>
                    <p id="filePath" class="text-[10px] text-on-surface-variant font-mono">No file selected</p>
                </div>
            </div>
            <div class="flex items-center gap-6">
                <div id="diffSummary" class="text-[11px] font-medium flex gap-3">
                    <span id="addCount" class="text-primary">+0</span>
                    <span id="removeCount" class="text-error">-0</span>
                </div>

                <!-- Compare Mode Toggle -->
                <div class="flex items-center bg-surface-container-low rounded-lg p-0.5 border border-outline-variant/10">
                    <button id="btnModeSnapshot" onclick="window.ACP.setCompareMode(false)" class="flex items-center gap-1.5 px-3 py-1.5 rounded-md text-[10px] font-bold uppercase tracking-wider transition-all bg-surface-container-highest text-primary shadow-sm">
                        <span class="material-symbols-outlined text-[16px]">history</span>
                        Snapshot
                    </button>
                    <button id="btnModeLatest" onclick="window.ACP.setCompareMode(true)" class="flex items-center gap-1.5 px-3 py-1.5 rounded-md text-[10px] font-bold uppercase tracking-wider transition-all text-on-surface-variant/60 hover:text-on-surface hover:bg-surface-container-high">
                        <span class="material-symbols-outlined text-[16px]">text_compare</span>
                        Latest
                    </button>
                </div>

                <button id="btnRollback" class="hidden flex items-center gap-2 bg-transparent border border-outline-variant/50 text-on-surface px-4 py-2 rounded-full hover:bg-surface-container-high transition-colors font-label text-sm font-medium active:scale-95" onclick="window.ACP.rollbackCurrentDiff()">
                    <span class="material-symbols-outlined text-sm">settings_backup_restore</span>
                    <span id="btnRollbackText">Rollback to #---</span>
                </button>
            </div>
        </header>

        <!-- Diff Area -->
        <div class="flex-1 overflow-auto relative">
            <div class="min-w-[900px]">
                <!-- Table Header -->
                <div class="sticky-header grid grid-cols-[3.5rem_1fr_2rem_3.5rem_1fr] bg-surface-container-highest/95 backdrop-blur-sm border-b border-outline-variant/20 py-2 text-[10px] font-bold uppercase tracking-wider text-on-surface-variant">
                    <div class="text-center border-r border-outline-variant/20">OLD</div>
                    <div class="pl-4 border-r border-outline-variant/20">Original Source</div>
                    <div class="text-center border-r border-outline-variant/20">ACT</div>
                    <div class="text-center border-r border-outline-variant/20">NEW</div>
                    <div class="pl-4">Modified Content</div>
                </div>

                <!-- Diff Rows -->
                <div id="diffContent" class="flex flex-col pb-8">
                    <!-- Rows injected here -->
                </div>
            </div>

            <!-- Empty State -->
            <div id="emptyState" class="absolute inset-0 flex flex-col items-center justify-center bg-surface z-30">
                <div class="w-16 h-16 rounded-2xl bg-surface-container-highest flex items-center justify-center border border-outline-variant/20 mb-4">
                    <span class="material-symbols-outlined text-primary text-3xl">unfold_more</span>
                </div>
                <p class="text-sm text-on-surface-variant">Select a file from history to view differences.</p>
            </div>
        </div>
    </main>

    <!-- Right Sidebar (File History) -->
    <aside id="historySidebar" class="w-80 bg-surface-container-lowest border-l border-outline-variant/10 flex flex-col h-full overflow-hidden z-20">
        <div class="p-4 border-b border-outline-variant/10 flex justify-between items-center bg-surface-container-low/50 backdrop-blur-md sticky top-0">
            <h3 class="font-headline font-semibold text-on-surface text-sm tracking-wide uppercase">File History</h3>
        </div>
        <div id="fileHistoryContainer" class="flex-1 overflow-y-auto p-3 space-y-2">
            <div class="p-8 text-center text-xs text-on-surface-variant italic opacity-30">Select a session first</div>
        </div>
    </aside>
</body>
</html>
