<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>ACP Agent Manager</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
    <link href="https://cdn.agentclientprotocol.com/registry/v1/latest/gemini.svg" rel="icon">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
    
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary-fixed-variant": "#006832", "background": "#0e0e0e", "on-secondary-container": "#bfd2e9", "on-secondary-fixed": "#2b3d4f", "secondary-fixed-dim": "#bed1e7", "on-primary-container": "#004f24", "outline": "#767575", "tertiary": "#7ae6ff", "primary-fixed": "#3fff8b", "on-tertiary-fixed": "#00343d", "on-tertiary": "#005360", "inverse-primary": "#006e35", "on-tertiary-container": "#004955", "on-error": "#490006", "inverse-on-surface": "#565555", "on-surface": "#ffffff", "surface": "#0e0e0e", "on-error-container": "#ffa8a3", "surface-container": "#1a1a1a", "primary-dim": "#24f07e", "surface-container-highest": "#262626", "secondary": "#ccdff6", "primary-fixed-dim": "#24f07e", "surface-variant": "#262626", "inverse-surface": "#fcf9f8", "on-primary": "#005d2c", "surface-container-low": "#131313", "error-dim": "#d7383b", "tertiary-fixed-dim": "#00cdec", "on-surface-variant": "#adaaaa", "error-container": "#9f0519", "surface-tint": "#3fff8b", "primary-container": "#13ea79", "outline-variant": "#484847", "on-background": "#ffffff", "error": "#ff716c", "on-tertiary-fixed-variant": "#005361", "secondary-dim": "#bed1e7", "on-secondary": "#3e5063", "surface-container-high": "#20201f", "surface-dim": "#0e0e0e", "tertiary-fixed": "#00dcfd", "secondary-fixed": "#ccdff6", "primary": "#3fff8b", "tertiary-dim": "#00cdec", "secondary-container": "#36485b", "surface-bright": "#2c2c2c", "surface-container-lowest": "#000000", "on-secondary-fixed-variant": "#485a6d", "tertiary-container": "#00dcfd", "on-primary-fixed": "#004820"
                    },
                    "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                    "fontFamily": { "headline": ["Manrope", "sans-serif"], "body": ["Inter", "sans-serif"], "label": ["Inter", "sans-serif"] }
                }
            }
        }
    </script>
    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24; }
        .material-symbols-outlined[data-weight="fill"] { font-variation-settings: 'FILL' 1, 'wght' 300, 'GRAD' 0, 'opsz' 24; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #262626; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #484847; }
        
        .markdown-body { background: transparent !important; color: #e6edf3 !important; font-family: inherit !important; font-size: 0.9375rem !important; }
        .markdown-body pre { background: #000 !important; border: 1px solid rgba(72, 72, 71, 0.5) !important; border-radius: 0.75rem !important; padding: 1rem !important; margin: 1rem 0 !important; overflow-x: auto; }
        .markdown-body code { font-family: 'JetBrains Mono', monospace !important; color: #ffffff !important; }
        .markdown-body p { margin-bottom: 1rem !important; line-height: 1.6 !important; }
        .markdown-body p:last-child { margin-bottom: 0 !important; }

        [contenteditable=true]:empty:before {
            content: attr(placeholder);
            pointer-events: none;
            color: rgba(173, 170, 170, 0.3);
            display: block;
        }

        .dropdown-header {
            padding: 12px;
            font-size: 10px;
            font-weight: 700;
            color: #adaaaa;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            border-bottom: 1px solid rgba(72, 72, 71, 0.1);
            background-color: #161616;
        }

        .cmd-item { border-bottom: 1px solid rgba(72, 72, 71, 0.05); }
        .cmd-item:last-child { border-bottom: none; }
        .cmd-item.active { background-color: rgba(63, 255, 139, 0.05); }
        .cmd-item.active .icon-box { background-color: #3fff8b; color: #000; }
        .cmd-item.active .text-highlight { color: #3fff8b; }
        .cmd-item:hover:not(.active) { background-color: rgba(255, 255, 255, 0.05); }

        /* Disable state styles */
        button:disabled {
            cursor: not-allowed !important;
            pointer-events: none !important;
            opacity: 0.2 !important;
        }
        
        @keyframes pulse-custom {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.9); }
        }
        .animate-pulse-custom {
            animation: pulse-custom 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes focus-highlight {
            0% { background-color: rgba(63, 255, 139, 0.25); filter: brightness(1.2); box-shadow: 0 0 20px rgba(63, 255, 139, 0.15); }
            100% { background-color: transparent; filter: brightness(1); box-shadow: none; }
        }
        .focus-highlight {
            animation: focus-highlight 2.5s cubic-bezier(0.4, 0.2, 0, 1) forwards;
            border-radius: 0.75rem;
        }
    </style>

    <script>
        window.sendAcp = function(url) {
            const finalUrl = url.includes('://') ? url : 'acp-action://' + url;
            let iframe = document.getElementById('acp-comm-frame');
            if (!iframe) {
                iframe = document.createElement('iframe'); 
                iframe.id = 'acp-comm-frame';
                iframe.style.display = 'none'; 
                document.body.appendChild(iframe);
            }
            iframe.src = finalUrl + (finalUrl.includes('?') ? '&' : '?') + 't=' + Date.now();
        };

        window.sendUi = function(url) {
            const finalUrl = url.includes('://') ? url : 'ui-action://' + url;
            window.sendAcp(finalUrl);
        };

        window.ACP = {
            lastAiMsgId: '',
            lastAiThoughtId: null,
            lastBlockType: '',
            lastMessageRole: '',
            activeSessionId: '',
            selectedSearchSessionId: '',
            availableCommands: [],
            workspaceFiles: [],
            selectedCommandIndex: 0,
            selectedFileIndex: 0,
            filteredCommands: [],
            filteredFiles: [],
            thoughtStartTime: 0,
            accumulatedThought: '',
            isProcessingActive: false,
            lastRenderedDate: null,
            allSessions: [],
            
            toggleSearch: (force) => {
                const sidebar = document.getElementById('searchSidebar');
                const isOpen = force !== undefined ? force : sidebar.classList.contains('hidden');
                
                if (isOpen) {
                    sidebar.classList.remove('hidden');
                    window.ACP.selectedSearchSessionId = window.ACP.activeSessionId;
                    window.ACP.renderSearchSessionMenu();
                    document.getElementById('searchQuery').focus();
                } else {
                    sidebar.classList.add('hidden');
                }
            },

            toggleSearchOptionsAccordion: () => {
                const content = document.getElementById('searchOptionsAccordionContent');
                const chevron = document.getElementById('searchOptionsAccordionChevron');
                const isHidden = content.classList.contains('hidden');
                
                if (isHidden) {
                    content.classList.remove('hidden');
                    chevron.style.transform = 'rotate(180deg)';
                } else {
                    content.classList.add('hidden');
                    chevron.style.transform = 'rotate(0deg)';
                }
            },

            toggleSearchSessionOptions: () => {
                const checked = document.getElementById('searchThisSessionOnly').checked;
                document.getElementById('searchSessionDropdownContainer').classList.toggle('hidden', !checked);
                if (!checked) window.ACP.toggleSearchSessionMenu(false);
            },

            toggleSearchSessionMenu: (force) => {
                const menu = document.getElementById('searchSessionMenu');
                const isShow = (force !== undefined) ? force : menu.classList.contains('hidden');
                if (isShow) window.ACP.renderSearchSessionMenu(); 
                menu.classList.toggle('hidden', !isShow);
            },

            renderSearchSessionMenu: () => {
                const menu = document.getElementById('searchSessionMenu');
                const trigger = document.getElementById('searchSessionTrigger');
                if (!menu || !trigger) return;

                const activeSess = window.ACP.allSessions.find(s => s.id === window.ACP.selectedSearchSessionId) || window.ACP.allSessions[0];
                if (activeSess) {
                    trigger.querySelector('span:first-child').innerText = activeSess.name;
                    window.ACP.selectedSearchSessionId = activeSess.id;
                }

                menu.innerHTML = window.ACP.allSessions.map(s => `
                    <button onclick="window.ACP.selectSearchSession('${s.id}', '${s.name}')"
                        class="w-full text-left px-4 py-2.5 text-[11px] hover:bg-surface-container-high transition-colors border-b border-white/5 last:border-0 flex flex-col gap-0.5 first:rounded-t-xl last:rounded-b-xl">
                        <span class="${s.id === window.ACP.selectedSearchSessionId ? 'text-primary font-bold' : 'text-on-surface'}">${s.name}</span>
                        <span class="text-[9px] text-on-surface-variant/40 truncate font-mono">${s.workspace || 'Root'}</span>
                    </button>
                `).join('');
            },

            selectSearchSession: (id, name) => {
                window.ACP.selectedSearchSessionId = id;
                document.getElementById('searchSessionTrigger').querySelector('span:first-child').innerText = name;
                window.ACP.toggleSearchSessionMenu(false);
            },

            executeSearch: () => {
                const query = document.getElementById('searchQuery').value.trim();
                if (!query) return;

                document.getElementById('searchEmptyState').classList.add('hidden');
                document.getElementById('searchLoadingState').classList.remove('hidden');
                document.getElementById('searchResultsList').classList.add('hidden');

                const opts = {
                    case: document.getElementById('searchCase').checked,
                    regex: document.getElementById('searchRegex').checked,
                    active: document.getElementById('searchActive').checked,
                    inactive: document.getElementById('searchInactive').checked,
                    thought: document.getElementById('searchThought').checked,
                    user: document.getElementById('searchUser').checked,
                    agent: document.getElementById('searchAgent').checked,
                    thisSession: document.getElementById('searchThisSessionOnly').checked,
                    targetSessionId: window.ACP.selectedSearchSessionId
                };

                let url = `search-conversations?query=${encodeURIComponent(query)}&case=${opts.case}&regex=${opts.regex}&active=${opts.active}&inactive=${opts.inactive}&thought=${opts.thought}&user=${opts.user}&agent=${opts.agent}`;
                if (opts.thisSession && opts.targetSessionId) url += `&targetSessionId=${opts.targetSessionId}`;

                window.sendAcp(url);
            },

            updateSearchResults: (base64) => {
                try {
                    const binary = window.atob(base64);
                    const bytes = new Uint8Array(binary.length);
                    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
                    const json = new TextDecoder().decode(bytes);
                    const results = JSON.parse(json);
                    
                    const list = document.getElementById('searchResultsList');
                    const loading = document.getElementById('searchLoadingState');
                    
                    loading.classList.add('hidden');
                    list.classList.remove('hidden');
                    
                    if (results.length === 0) {
                        list.innerHTML = '<div class="text-center py-12 opacity-40"><p class="text-sm">No matches found</p></div>';
                        return;
                    }

                    list.innerHTML = results.map(session => `
                        <div class="bg-surface-container rounded-xl border border-outline-variant/10 overflow-hidden mb-3 shadow-sm hover:border-outline-variant/30 transition-all">
                            <button onclick="this.nextElementSibling.classList.toggle('hidden'); this.querySelector('.chevron').innerText = this.nextElementSibling.classList.contains('hidden') ? 'expand_more' : 'expand_less';" 
                                class="w-full flex items-center justify-between p-4 text-left hover:bg-surface-container-high transition-colors">
                                <div class="min-w-0">
                                    <div class="flex items-center gap-2 mb-1">
                                        <span class="text-xs font-bold text-primary truncate">${session.name}</span>
                                        <span class="text-[10px] text-on-surface-variant/50">${session.matches.length} results</span>
                                    </div>
                                    <div class="text-[10px] text-on-surface-variant/40 truncate flex items-center gap-1">
                                        <span class="material-icons text-[12px]">folder</span>
                                        ${session.workspace}
                                    </div>
                                </div>
                                <span class="material-icons chevron text-on-surface-variant/30 transition-transform duration-200">expand_more</span>
                            </button>
                            <div class="hidden border-t border-outline-variant/10 bg-surface/30">
                                ${session.matches.map(match => `
                                    <div onclick="window.ACP.goToMatch('${session.sessionId}', '${match.timestamp}')" 
                                        class="p-4 hover:bg-surface-container-highest cursor-pointer border-b last:border-b-0 border-outline-variant/5 group transition-colors">
                                        <div class="flex items-center justify-between mb-2">
                                            <div class="flex items-center gap-2">
                                                <span class="px-1.5 py-0.5 rounded bg-surface-container-high text-[9px] font-bold uppercase tracking-wider text-on-surface-variant">${match.role}</span>
                                                <span class="text-[10px] text-on-surface-variant/40">${match.timestamp}</span>
                                            </div>
                                            <span class="material-icons text-xs text-primary opacity-0 group-hover:opacity-100 transition-opacity">arrow_forward</span>
                                        </div>
                                        <div class="text-xs text-on-surface-variant leading-relaxed line-clamp-2 italic font-serif">
                                            ${match.snippet}
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `).join('');
                } catch(e) { console.error('Search update error:', e); }
            },

            goToMatch: (sessionId, timestamp) => {
                if (window.ACP.activeSessionId !== sessionId) {
                    window.sendAcp(`select-session?id=${sessionId}`);
                }
                
                const tryScroll = (count) => {
                    const target = Array.from(document.querySelectorAll('[data-timestamp]')).find(el => el.getAttribute('data-timestamp') === timestamp);
                    if (target) {
                        target.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        
                        let highlightTarget = null;
                        
                        // Check if it's a thought content
                        if (target.id && target.id.startsWith('thought-')) {
                            const header = target.previousElementSibling; // The "Thought Process" header
                            if (header) {
                                highlightTarget = header;
                                // Automatically expand if collapsed
                                if (target.classList.contains('hidden')) header.click();
                            }
                        } else if (target.parentElement) {
                            highlightTarget = target.parentElement; // The chat bubble
                        }
                        
                        if (highlightTarget) {
                            highlightTarget.classList.remove('focus-highlight');
                            void highlightTarget.offsetWidth; 
                            highlightTarget.classList.add('focus-highlight');
                        }
                    } else if (count < 20) {
                        setTimeout(() => tryScroll(count + 1), 200);
                    }
                };
                tryScroll(0);
                window.ACP.toggleSearch(false);
            },
            
            toggleDropdown: (e, force) => {
                if (e) e.stopPropagation();
                const d = document.getElementById('newChatDropdown');
                if (!d) return;
                const isShow = (force !== undefined) ? force : (d.classList.contains('hidden'));
                if (isShow) {
                    d.classList.remove('hidden');
                    setTimeout(() => { d.classList.remove('opacity-0', 'invisible'); d.classList.add('opacity-100', 'visible'); }, 10);
                } else {
                    d.classList.add('opacity-0', 'invisible'); d.classList.remove('opacity-100', 'visible');
                    setTimeout(() => { d.classList.add('hidden'); }, 200);
                }
            },
            toggleHistory: () => {
                const sidebar = document.getElementById('historySidebar');
                if (sidebar) {
                    const isHidden = sidebar.classList.contains('hidden');
                    if (isHidden) window.sendAcp('get-file-history');
                    sidebar.classList.toggle('hidden');
                }
            },

            showProcessing: (show) => {
                let indicator = document.getElementById('processingIndicator');
                window.ACP.isProcessingActive = show;
                
                if (show) {
                    const container = document.getElementById('mainChatCanvasInner');
                    if (!indicator) {
                        const html = `
                            <div id="processingIndicator" class="flex flex-col items-start gap-1.5 max-w-3xl mr-auto mt-4 mb-8 px-4">
                                <div class="bg-surface-container-highest px-5 py-3.5 rounded-2xl rounded-tl-sm border border-outline-variant/10 flex items-center gap-2 shadow-lg">
                                    <div class="w-1.5 h-1.5 rounded-full bg-primary/40 animate-pulse"></div>
                                    <div class="w-1.5 h-1.5 rounded-full bg-primary/70 animate-pulse delay-75"></div>
                                    <div class="w-1.5 h-1.5 rounded-full bg-primary animate-pulse delay-150"></div>
                                </div>
                            </div>`;
                        container.insertAdjacentHTML('beforeend', html);
                    } else {
                        container.appendChild(indicator);
                    }
                    const outer = document.getElementById('mainChatCanvas');
                    outer.scrollTop = outer.scrollHeight;
                } else if (indicator) {
                    indicator.remove();
                }
            },

            sendMessage: async () => {
                const input = document.getElementById('userInput');
                const text = input.innerText.trim();
                if (text) {
                    input.innerHTML = '';
                    window.ACP.lastAiMsgId = ''; 
                    window.ACP.lastAiThoughtId = null; 
                    window.ACP.lastBlockType = ''; 
                    window.ACP.lastMessageRole = '';
                    window.ACP.accumulatedThought = '';
                    
                    window.ACP.streamMessage({content: text, role: 'user', stopReason: '', timestamp: new Date().toISOString()});
                    
                    window.ACP.showProcessing(true);
                    window.sendAcp('send-message?text=' + encodeURIComponent(text));
                }
            },

            resumeSession: () => {
                window.sendAcp('resume-session?id=' + window.ACP.activeSessionId);
            },

            addMessageToUI: (role, text, timestamp) => {
                const container = document.getElementById('mainChatCanvasInner');
                
                if (timestamp) {
                    const datePart = timestamp.split(' ')[0]; 
                    if (window.ACP.lastRenderedDate !== datePart) {
                        window.ACP.lastRenderedDate = datePart;
                        const todayStr = new Date().toISOString().split('T')[0];
                        const displayDate = (datePart === todayStr) ? "Today" : datePart;
                        
                        container.insertAdjacentHTML('beforeend', `
                            <div class="flex justify-center my-8 px-4">
                                <span class="px-3 py-1 text-[11px] font-medium tracking-wider text-on-surface-variant uppercase bg-surface-container rounded-full border border-outline-variant/10">
                                    ${displayDate}
                                </span>
                            </div>
                        `);
                    }
                }

                let time = '';
                if (timestamp) {
                    const parts = timestamp.split(' ');
                    if (parts.length > 1) time = parts[1].substring(0, 5);
                    else time = timestamp.substring(0, 5);
                } else {
                    time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
                }
                
                const id = 'msg-' + Date.now() + Math.random().toString(36).substr(2, 5);

                let html = role === 'me' ? `
                    <div id="wrapper-${id}" class="flex flex-col items-end gap-1.5 max-w-3xl ml-auto mb-8 px-4">
                        <div class="bg-secondary-container text-on-surface px-5 py-3.5 rounded-2xl rounded-tr-sm shadow-xl shadow-black/20 border border-white/5 transition-all">
                            <div id="${id}" data-timestamp="${timestamp}" class="markdown-body text-sm leading-relaxed"></div>
                        </div>
                        <div class="flex items-center gap-2 mr-1">
                            <span class="text-[11px] text-on-surface-variant font-medium">${time}</span>
                            <span class="material-symbols-outlined text-[14px] text-on-surface-variant">check_circle</span>
                        </div>
                    </div>` : `
                    <div id="wrapper-${id}" class="flex flex-col items-start gap-1.5 max-w-3xl mr-auto group mb-8 px-4">
                        <div class="flex items-center gap-3 mb-1 ml-1 transition-opacity">
                            <span class="text-[11px] font-headline font-semibold text-primary">Gemini-CLI</span>
                            <span class="text-[11px] text-on-surface-variant font-medium">${time}</span>
                        </div>
                        <div class="bg-surface-container-highest text-on-surface px-5 py-4 rounded-2xl rounded-tl-sm shadow-xl shadow-black/20 border border-outline-variant/10 w-full relative transition-all">
                            <div id="${id}" data-timestamp="${timestamp}" class="markdown-body min-h-[1.5rem]"></div>
                            <div id="${id}-actions" class="mt-4 pt-4 border-t border-outline-variant/10 hidden flex-wrap gap-2"></div>
                        </div>
                    </div>`;
                container.insertAdjacentHTML('beforeend', html);
                if (window.ACP.isProcessingActive) window.ACP.showProcessing(true);
                const outer = document.getElementById('mainChatCanvas');
                outer.scrollTop = outer.scrollHeight;
                return id;
            },

            createThoughtContainer: () => {
                const container = document.getElementById('mainChatCanvasInner');
                const id = 'thought-' + Date.now();
                const hdrId = 'thought-hdr-' + Date.now();
                window.ACP.thoughtStartTime = Date.now();
                
                const html = `
                    <div class="flex justify-start mb-4 px-4">
                        <div class="w-full max-w-3xl flex flex-col space-y-2">
                            <div id="${hdrId}" class="flex items-center space-x-2 text-xs text-gray-500 dark:text-text-muted cursor-pointer hover:text-gray-700 dark:hover:text-gray-300 transition-colors select-none w-max group py-1 px-3 rounded-lg">
                                <span class="material-icons text-sm text-primary">psychology</span>
                                <span class="font-medium">Thinking...</span>
                                <span class="material-icons text-sm">expand_more</span>
                            </div>
                            <div id="${id}" data-timestamp="${window.ACP.thoughtStartTime}" class="pl-5 border-l border-gray-200 dark:border-border-dark ml-2 space-y-2 hidden transition-all">
                            </div>
                        </div>
                    </div>`;
                container.insertAdjacentHTML('beforeend', html);
                if (window.ACP.isProcessingActive) window.ACP.showProcessing(true);
                const outer = document.getElementById('mainChatCanvas');
                outer.scrollTop = outer.scrollHeight;
                return { contentId: id, headerId: hdrId };
            },

            parseAndRenderThought: (text, containerId) => {
                const div = document.getElementById(containerId);
                if (!div) return;
                const parts = text.split(/\*\*([^*]+)\*\*/g);
                let html = '';
                if (parts[0] && parts[0].trim()) {
                    html += `<div class="text-[11px] text-gray-500 dark:text-text-muted/60 mb-2 italic px-1">${marked.parseInline(parts[0])}</div>`;
                }
                for (let i = 1; i < parts.length; i += 2) {
                    const subject = parts[i].trim();
                    const content = parts[i+1] ? parts[i+1].trim() : '';
                    html += `
                        <div class="flex flex-col space-y-1 mb-2.5 last:mb-0">
                            <div class="flex items-center space-x-2 text-xs text-gray-500 dark:text-text-muted">
                                <span class="material-icons text-[14px]">check</span>
                                <span class="font-medium">${subject}</span>
                            </div>
                            ${content ? `<div class="pl-5 text-[11px] text-gray-500/70 dark:text-text-muted/60 leading-relaxed markdown-body !bg-transparent !p-0 !m-0 border-none shadow-none opacity-80">${marked.parse(content)}</div>` : ''}
                        </div>`;
                }
                div.innerHTML = html;
            },

            finalizeThought: () => {
                if (window.ACP.lastAiThoughtId) {
                    const hdr = document.getElementById(window.ACP.lastAiThoughtId.headerId);
                    const cnt = document.getElementById(window.ACP.lastAiThoughtId.contentId);
                    if (hdr) {
                        const duration = Math.round((Date.now() - window.ACP.thoughtStartTime) / 1000);
                        hdr.classList.remove('py-1');
                        hdr.classList.add('py-1.5');
                        hdr.querySelector('.material-icons').classList.remove('text-primary');
                        hdr.querySelector('.material-icons').classList.add('text-gray-400', 'dark:text-gray-500');
                        hdr.querySelector('.font-medium').innerText = `Thought Process (${duration}s)`;
                        const arrow = hdr.querySelector('.material-icons:last-child');
                        if (arrow) arrow.innerText = 'expand_more';
                        if (cnt) cnt.classList.add('hidden');
                        hdr.onclick = () => {
                            const isHidden = cnt.classList.contains('hidden');
                            cnt.classList.toggle('hidden');
                            if (arrow) arrow.innerText = isHidden ? 'expand_less' : 'expand_more';
                        };
                    }
                }
            },

            updateSessionList: (data) => {
                const sessions = typeof data === 'string' ? JSON.parse(data) : data;
                window.ACP.allSessions = sessions;
                const container = document.getElementById('sessionListContainer');
                const sendBtn = document.getElementById('send-button');
                const userInput = document.getElementById('userInput');
                const modelSelectBtn = document.getElementById('modelSelectBtn');
                const attachBtn = document.getElementById('attachBtn');
                const toolsBtn = document.getElementById('toolsBtn');
                
                let activeSession = sessions.find(s => s.active);
                if (activeSession) {
                    if (window.ACP.activeSessionId !== activeSession.id) {
                        window.ACP.activeSessionId = activeSession.id;
                        document.getElementById('mainChatCanvasInner').innerHTML = '';
                    }
                    document.getElementById('activeAgentHeader').innerText = activeSession.name;
                    document.getElementById('mainInputArea').classList.remove('hidden');
                    document.getElementById('mainChatCanvas').classList.remove('hidden');
                    document.getElementById('mainEmptyArea').classList.add('hidden');
                    if (activeSession.commands) window.ACP.availableCommands = activeSession.commands;

                    const isOffline = !activeSession.online && !activeSession.loading;
                    const isLoading = activeSession.loading;
                    const setDisabled = (val) => {
                        if (modelSelectBtn) modelSelectBtn.disabled = val;
                        if (attachBtn) attachBtn.disabled = val;
                        if (toolsBtn) toolsBtn.disabled = val;
                    };

                    if (isLoading) {
                        sendBtn.innerHTML = `<span class="material-symbols-outlined text-[20px] animate-spin">refresh</span>`;
                        sendBtn.onclick = null;
                        userInput.setAttribute('contenteditable', 'false');
                        setDisabled(true);
                    } else if (isOffline) {
                        sendBtn.innerHTML = `<span class="material-symbols-outlined text-[20px]">autorenew</span>`;
                        sendBtn.onclick = () => window.ACP.resumeSession();
                        userInput.setAttribute('contenteditable', 'false');
                        setDisabled(true);
                    } else {
                        sendBtn.innerHTML = `<span class="material-symbols-outlined text-[20px]">send</span>`;
                        sendBtn.onclick = () => window.ACP.sendMessage();
                        userInput.setAttribute('contenteditable', 'true');
                        setDisabled(false);
                    }

                    if (activeSession.models && modelSelectBtn) {
                        const currentModelId = activeSession.models.currentModelId || '';
                        let currentModelLabel = currentModelId;
                        const dropdown = document.getElementById('modelDropdown');
                        if (dropdown && activeSession.models.availableModels) {
                            dropdown.innerHTML = '<div class="dropdown-header">AVAILABLE MODELS</div>';
                            activeSession.models.availableModels.forEach(m => {
                                const mId = typeof m === 'string' ? m : m.modelId;
                                const mName = typeof m === 'string' ? m : (m.name || m.modelId);
                                const mDesc = typeof m === 'object' ? m.description : '';
                                const isActive = mId === currentModelId;
                                if (isActive) currentModelLabel = mName;
                                dropdown.innerHTML += `
                                    <button onclick="window.sendAcp('change-model?modelId=${mId}'); document.getElementById('modelDropdown').classList.add('hidden');"
                                        class="cmd-item w-full text-left px-5 py-3 transition-colors flex items-center justify-between">
                                        <div class="flex flex-col min-w-0">
                                            <span class="text-sm font-bold ${isActive ? 'text-primary' : 'text-on-surface'}">${mName}</span>
                                            ${mDesc ? `<span class="text-[10px] text-on-surface-variant/60 truncate mt-0.5">${mDesc}</span>` : ''}
                                        </div>
                                        ${isActive ? '<span class="material-icons text-primary text-sm">check</span>' : ''}
                                    </button>`;
                            });
                        }
                        modelSelectBtn.querySelector('span:nth-child(2)').innerText = currentModelLabel || 'Select Model';
                        modelSelectBtn.querySelector('span:nth-child(2)').className = 'text-on-surface font-medium';
                    }
                } else {
                    window.ACP.activeSessionId = '';
                    document.getElementById('activeAgentHeader').innerText = 'No Session';
                    document.getElementById('mainInputArea').classList.add('hidden');
                    document.getElementById('mainChatCanvas').classList.add('hidden');
                    document.getElementById('mainEmptyArea').classList.remove('hidden');
                    document.getElementById('mainChatCanvasInner').innerHTML = '';
                }

                container.innerHTML = sessions.map(s => `
                    <div onclick="window.sendAcp('select-session?id=${s.id}')" 
                        class="flex items-center gap-3 px-3 py-2.5 rounded-lg cursor-pointer group relative overflow-hidden ${s.active ? 'bg-surface-container-high border-l-[3px] border-primary' : 'hover:bg-surface-container-high/50 text-on-surface-variant hover:text-on-surface border-l-[3px] border-transparent'}">
                        <div class="relative z-10">
                            <div class="w-9 h-9 rounded-full bg-surface-container flex items-center justify-center border border-outline-variant/20">
                                <span class="material-icons text block ${s.active ? 'text-primary' : ''}">${s.active ? 'forum' : 'chat_bubble_outline'}</span>
                            </div>
                            <div class="absolute -bottom-0.5 -right-0.5 w-3 h-3 ${s.online ? 'bg-primary' : 'bg-gray-400'} rounded-full border-2 border-surface-container-lowest"></div>
                        </div>
                        <div class="flex-1 min-w-0 z-10">
                            <div class="text-sm font-headline ${s.active ? 'font-semibold text-primary' : 'font-medium'} truncate">${s.name}</div>
                            <div class="text-xs ${s.active ? 'text-on-surface-variant' : 'opacity-60'} truncate">${s.workspace || ''}</div>
                        </div>
                        <span class="material-symbols-outlined text-on-surface-variant text-[16px] z-10 ${s.pinned ? 'opacity-100' : 'opacity-0 group-hover:opacity-100'}" data-weight="fill">push_pin</span>
                    </div>`).join('');
            },

            streamThought: (data) => {
                if (window.ACP.lastBlockType !== 'thought') {
                    window.ACP.lastAiThoughtId = window.ACP.createThoughtContainer();
                    window.ACP.lastBlockType = 'thought';
                    window.ACP.accumulatedThought = '';
                }
                window.ACP.accumulatedThought += data.content;
                window.ACP.parseAndRenderThought(window.ACP.accumulatedThought, window.ACP.lastAiThoughtId.contentId);
                const div = document.getElementById(window.ACP.lastAiThoughtId.contentId);
                if (div) div.classList.remove('hidden'); 
                const outer = document.getElementById('mainChatCanvas');
                outer.scrollTop = outer.scrollHeight;
            },

            streamMessage: (data) => {
                const { content, role, stopReason, timestamp } = data;
                const targetRole = role === 'user' ? 'me' : 'ai';
                if (window.ACP.lastBlockType === 'thought') window.ACP.finalizeThought();
                if (window.ACP.lastBlockType !== 'message' || window.ACP.lastMessageRole !== targetRole) {
                    window.ACP.lastAiMsgId = window.ACP.addMessageToUI(targetRole, '', timestamp);
                    window.ACP.lastBlockType = 'message';
                    window.ACP.lastMessageRole = targetRole;
                }

                const targetDiv = document.getElementById(window.ACP.lastAiMsgId);
                if (targetDiv) {
                    let rendered = content;
                    rendered = rendered.replace(/(@(?:"[^"]+"|[^\s\xa0\n]+))/g, (match) => {
                        let rawPath = match.substring(1).replace(/(^"|"$)/g, '');
                        let displayPath = rawPath;
                        let fullPath = rawPath;
                        if (rawPath.startsWith('file:///')) {
                            fullPath = decodeURIComponent(rawPath.substring(8));
                            let lastSlash = Math.max(fullPath.lastIndexOf('/'), fullPath.lastIndexOf('\\'));
                            displayPath = fullPath.substring(lastSlash + 1);
                        }
                        let safeFullPath = encodeURIComponent(fullPath);
                        return `<span class="text-primary font-medium px-1.5 py-0.5 bg-primary/10 hover:bg-primary/20 cursor-pointer rounded mx-0.5 transition-colors" contenteditable="false" onclick="if(event.detail===1){window.sendUi('open-file-viewer?path=' + '${safeFullPath}')}else if(event.detail===2){window.sendUi('open-diff-viewer?sessionId=' + window.ACP.activeSessionId + '&path=' + '${safeFullPath}')}">@${displayPath}</span>`;
                    });

                    if (window.marked) targetDiv.innerHTML = marked.parse(rendered);
                    else targetDiv.innerText = rendered;
                }
                if (stopReason) window.ACP.showProcessing(false);
                const outer = document.getElementById('mainChatCanvas');
                outer.scrollTop = outer.scrollHeight;
            },

            renderPermissionRequest: (data) => {
                try {
                    const parsed = typeof data === 'string' ? JSON.parse(data) : data;
                    const { id, toolCall, options } = parsed;
                    const actionContainerId = `${window.ACP.lastAiMsgId}-actions`;
                    const container = document.getElementById(actionContainerId);
                    if (!container) return;
                    container.classList.remove('hidden'); container.classList.add('flex');
                    const displayOptions = options || [{ optionId: 'allow_once', name: 'Allow Once', kind: 'allow_once' }, { optionId: 'cancel', name: 'Reject', kind: 'reject_once' }];
                    container.innerHTML = displayOptions.map(opt => {
                        let icon = 'check', color = 'text-primary';
                        if (opt.kind === 'allow_always' || opt.optionId.includes('always')) icon = 'done_all';
                        if (opt.kind === 'reject_once' || opt.optionId === 'cancel') { icon = 'close'; color = 'text-error'; }
                        return `
                            <button onclick="window.sendAcp('permission-response?id=${id}&optionId=${opt.optionId}'); this.parentElement.classList.add('opacity-50', 'pointer-events-none')"
                                class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-surface-container-low hover:bg-surface-container border border-outline-variant/20 text-xs font-medium text-on-surface transition-colors shadow-sm active:scale-95">
                                <span class="material-symbols-outlined text-[14px] ${color}">${icon}</span>
                                ${opt.name}
                            </button>`;
                    }).join('');
                    if (window.ACP.isProcessingActive) window.ACP.showProcessing(true);
                    const outer = document.getElementById('mainChatCanvas');
                    outer.scrollTop = outer.scrollHeight;
                } catch (e) { console.error('Permission render error:', e); }
            },

            updateFileHistoryBase64: (base64) => {
                try {
                    const binary = window.atob(base64);
                    const bytes = new Uint8Array(binary.length);
                    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
                    const json = new TextDecoder().decode(bytes);
                    const history = JSON.parse(json);
                    const container = document.getElementById('fileHistoryContainer');
                    if (!container) return;
                    if (!history || history.length === 0) {
                        container.innerHTML = '<div class="p-8 text-center text-xs text-on-surface-variant italic opacity-30">No history available</div>';
                        return;
                    }
                    const grouped = {};
                    history.forEach(item => {
                        const file = item.path.split(/[\/\\]/).pop();
                        if (!grouped[file]) grouped[file] = { path: item.path, entries: [] };
                        grouped[file].entries.push(item);
                    });
                    container.innerHTML = Object.keys(grouped).map(file => {
                        const data = grouped[file];
                        const lastTime = data.entries[0].timestamp.split(' ')[1];
                        const entriesHtml = data.entries.map((e, idx) => {
                            const time = e.timestamp.split(' ')[1];
                            const isFirst = idx === 0;
                            const colorClass = isFirst ? 'bg-primary' : 'bg-on-surface-variant';
                            const safePath = encodeURIComponent(e.path);
                            return `
                                <div class="relative cursor-pointer hover:bg-white/5 p-1 rounded" onclick="window.sendUi('open-diff-viewer?sessionId=' + window.ACP.activeSessionId + '&path=${safePath}&hashId=${e.id}')">
                                    <span class="absolute -left-[21px] top-2 w-2 h-2 rounded-full ${colorClass} border-2 border-surface-container-low"></span>
                                    <p class="text-xs text-on-surface hover:text-primary transition-colors">Diff: ${e.id || 'Snap'}</p>
                                    <p class="text-[10px] text-on-surface-variant font-mono mt-0.5">${time}</p>
                                </div>`;
                        }).join('');
                        const safeDataPath = encodeURIComponent(data.path);
                        return `
                            <div class="bg-surface-container rounded-xl border border-outline-variant/10 overflow-hidden mb-2 select-none">
                                <div onclick="this.nextElementSibling.classList.toggle('hidden'); const icon = this.querySelector('.chevron'); icon.innerText = icon.innerText === 'expand_more' ? 'chevron_right' : 'expand_more';" 
                                     ondblclick="window.sendUi('open-file-viewer?path=${safeDataPath}')"
                                     class="p-3 flex items-start gap-3 cursor-pointer hover:bg-surface-container-high transition-colors">
                                    <span class="material-symbols-outlined text-primary mt-0.5 text-[18px]">description</span>
                                    <div class="flex-1 min-w-0">
                                        <p class="text-sm font-medium text-on-surface truncate" title="${data.path}">${file}</p>
                                        <p class="text-xs text-on-surface-variant mt-0.5">Last Modified ${lastTime}</p>
                                    </div>
                                    <span class="material-symbols-outlined text-on-surface-variant text-[16px] chevron">chevron_right</span>
                                </div>
                                <div class="hidden px-4 pb-3 pt-1 border-t border-outline-variant/5 bg-surface-container-low/50">
                                    <div class="relative pl-4 mt-2 space-y-3 before:absolute before:inset-y-0 before:left-[7px] before:w-px before:bg-outline-variant/20">
                                        ${entriesHtml}
                                    </div>
                                </div>
                            </div>`;
                    }).join('');
                } catch (e) { console.error('File History render error:', e); }
            },

            loadHistoryBase64: (base64) => {
                try {
                    const binary = window.atob(base64);
                    const bytes = new Uint8Array(binary.length);
                    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
                    const json = new TextDecoder().decode(bytes);
                    const data = JSON.parse(json);
                    document.getElementById('mainChatCanvasInner').innerHTML = '';
                    window.ACP.lastMessageRole = ''; window.ACP.lastBlockType = ''; window.ACP.lastRenderedDate = null;
                    data.forEach(msg => {
                        const r = msg.role;
                        if (r === 'thought') {
                            const tIds = window.ACP.createThoughtContainer();
                            window.ACP.lastBlockType = 'thought'; window.ACP.accumulatedThought = msg.content; window.ACP.lastAiThoughtId = tIds;
                            window.ACP.parseAndRenderThought(msg.content, tIds.contentId);
                            window.ACP.finalizeThought();
                        } else window.ACP.streamMessage({content: msg.content, role: r, stopReason: 'history', timestamp: msg.timestamp});
                    });
                } catch (e) { console.error('History load error:', e); }
            },

            clearChat: () => {
                document.getElementById('mainChatCanvasInner').innerHTML = '';
                window.ACP.lastAiMsgId = ''; window.ACP.lastAiThoughtId = null; window.ACP.lastBlockType = ''; window.ACP.lastMessageRole = '';
                window.ACP.lastRenderedDate = null;
                window.ACP.showProcessing(false);
            },

            getTriggerInfo: (text, trigger) => {
                const selection = window.getSelection();
                if (!selection.rangeCount) return null;
                const range = selection.getRangeAt(0);
                const node = range.startContainer;
                const content = node.textContent || "";
                const beforeCursor = content.substring(0, range.startOffset);
                const words = beforeCursor.split(/[\s\xa0\n]/);
                const lastWord = words[words.length - 1];
                if (lastWord.startsWith(trigger)) return lastWord.slice(1).toLowerCase();
                return null;
            },

            replaceTriggerRange: (trigger, replacementNodeOrText) => {
                const selection = window.getSelection();
                if (!selection.rangeCount) return;
                const range = selection.getRangeAt(0);
                const node = range.startContainer;
                const text = node.textContent || "";
                const beforeCursor = text.substring(0, range.startOffset);
                const words = beforeCursor.split(/[\s\xa0\n]/);
                const lastWord = words[words.length - 1];
                if (lastWord.startsWith(trigger)) {
                    range.setStart(node, range.startOffset - lastWord.length);
                    range.setEnd(node, range.startOffset);
                    range.deleteContents();
                    const inserted = (typeof replacementNodeOrText === 'string') ? document.createTextNode(replacementNodeOrText) : replacementNodeOrText;
                    range.insertNode(inserted);
                    range.setStartAfter(inserted);
                    const space = document.createTextNode('\u00A0');
                    range.insertNode(space);
                    range.setStartAfter(space);
                    range.collapse(true);
                    selection.removeAllRanges(); selection.addRange(range);
                }
            },

            scrollToActive: (containerId) => {
                const container = document.getElementById(containerId);
                if (!container) return;
                const active = container.querySelector('.cmd-item.active');
                if (active) active.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
            },

            handleSlashCommand: (text) => {
                const query = window.ACP.getTriggerInfo(text, '/');
                if (query !== null) {
                    const filtered = (window.ACP.availableCommands || []).filter(c => query === "" || c.name.toLowerCase().includes(query));
                    if (filtered.length > 0) {
                        window.ACP.filteredCommands = filtered; window.ACP.selectedCommandIndex = 0;
                        window.ACP.renderCommands(filtered); window.ACP.showCommands(true);
                        return;
                    }
                }
                window.ACP.showCommands(false);
            },

            handleAtCommand: (text) => {
                const query = window.ACP.getTriggerInfo(text, '@');
                if (query !== null) {
                    const filtered = (window.ACP.workspaceFiles || []).filter(f => query === "" || f.toLowerCase().includes(query)).slice(0, 20);
                    if (filtered.length > 0) {
                        window.ACP.filteredFiles = filtered; window.ACP.selectedFileIndex = 0;
                        window.ACP.renderFiles(filtered); window.ACP.showFiles(true);
                        return;
                    }
                }
                window.ACP.showFiles(false);
            },

            renderCommands: (commands) => {
                const container = document.getElementById('commandListContainer');
                if (!container) return;
                container.innerHTML = '<div class="dropdown-header">COMMANDS</div>' + commands.map((c, i) => `
                    <div onmousedown="event.preventDefault(); window.ACP.applyCommand('${c.name}')"
                        class="cmd-item w-full flex items-center gap-4 px-5 py-3.5 cursor-pointer transition-colors ${i === window.ACP.selectedCommandIndex ? 'active' : ''}">
                        <div class="icon-box w-7 h-7 rounded bg-surface-container flex items-center justify-center transition-colors"><span class="material-icons text-sm">terminal</span></div>
                        <div class="flex-1 min-w-0">
                            <div class="text-sm font-bold font-mono text-highlight">/${c.name}</div>
                            ${c.description ? `<div class="text-[11px] text-on-surface-variant/60 truncate mt-0.5">${c.description}</div>` : ''}
                        </div>
                    </div>`).join('');
            },

            renderFiles: (files) => {
                const container = document.getElementById('fileListContainer');
                if (!container) return;
                container.innerHTML = '<div class="dropdown-header">WORKSPACE FILES</div>' + files.map((f, i) => `
                    <div onmousedown="event.preventDefault(); window.ACP.applyFile('${f}')"
                        class="cmd-item w-full flex items-center gap-4 px-5 py-3 cursor-pointer transition-colors ${i === window.ACP.selectedFileIndex ? 'active' : ''}">
                        <span class="material-icons text-sm ${i === window.ACP.selectedFileIndex ? 'text-primary' : 'text-on-surface-variant/40'}">description</span>
                        <span class="text-xs font-mono truncate text-highlight">${f}</span>
                    </div>`).join('');
            },

            showCommands: (show) => { document.getElementById('commandDropdown').classList.toggle('hidden', !show); },
            showFiles: (show) => { document.getElementById('fileDropdown').classList.toggle('hidden', !show); },
            applyCommand: (name) => { window.ACP.replaceTriggerRange('/', '/' + name); window.ACP.showCommands(false); },
            applyFile: (path) => { 
                const pill = document.createElement('span');
                let safeFullPath = encodeURIComponent(path);
                pill.className = 'text-primary font-medium px-1.5 py-0.5 bg-primary/10 hover:bg-primary/20 cursor-pointer rounded mx-0.5 transition-colors';
                pill.setAttribute('onclick', `if(window.pillTimer) clearTimeout(window.pillTimer); if(event.detail===1){window.pillTimer=setTimeout(()=>window.sendUi('open-file-viewer?path=' + '${safeFullPath}'), 250);}else if(event.detail===2){window.sendUi('open-diff-viewer?sessionId=' + window.ACP.activeSessionId + '&path=' + '${safeFullPath}')}`);
                pill.contentEditable = 'false'; 
                const label = path.includes(' ') ? `@"${path}"` : `@${path}`;
                pill.innerText = label;
                window.ACP.replaceTriggerRange('@', pill); window.ACP.showFiles(false);
            },            setWorkspaceFiles: (files) => { window.ACP.workspaceFiles = files; },
            showTyping: (show) => { window.ACP.showProcessing(show); },
            parseStructuredPrompt: async (text) => { return text; }
        };
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.2.0/github-markdown-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
</head>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col min-w-0 bg-surface relative z-0">

                                <button id="send-button" class="w-9 h-9 rounded-full bg-primary flex items-center justify-center text-on-primary hover:bg-primary-container shadow-lg shadow-primary/20 transition-all duration-200 active:scale-95 group"><span class="material-symbols-outlined text-[20px]">send</span></button>
                            </div>
                        </div>
                        <div class="text-center mt-3"></div>
                    </div>
                </div>
            </div>
            
            <aside id="searchSidebar" class="hidden w-80 bg-surface border-l border-outline-variant/10 flex flex-col h-full shadow-2xl z-20 overflow-hidden">
                <div class="shrink-0 p-5 border-b border-outline-variant/10 bg-surface-container/30 relative z-[100]">
                    <div class="flex items-center justify-between mb-5">
                        <h2 class="text-sm font-headline font-bold text-on-surface flex items-center gap-2 uppercase tracking-wider">
                            <span class="material-icons text-primary text-[20px]">search</span> Search
                        </h2>
                        <button onclick="window.ACP.toggleSearch(false)" class="text-on-surface-variant hover:text-white"><span class="material-icons text-[18px]">close</span></button>
                    </div>
                    <div class="relative mb-5">
                        <input type="text" id="searchQuery" class="w-full bg-surface-container-highest text-on-surface border-none rounded-xl py-2.5 pl-10 pr-4 text-xs focus:ring-2 focus:ring-primary/30 transition-all placeholder:text-on-surface-variant/40" placeholder="Search..." onkeyup="if(event.key==='Enter') window.ACP.executeSearch()">
                        <span class="material-icons absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant/40 text-[16px]">search</span>
                    </div>

                    <div class="bg-surface-container-low/50 rounded-xl border border-outline-variant/10 overflow-visible">
                        <button onclick="window.ACP.toggleSearchOptionsAccordion()" class="w-full flex items-center justify-between p-3 text-left hover:bg-surface-container-high transition-colors rounded-t-xl">
                            <span class="text-[11px] font-bold text-on-surface-variant uppercase tracking-widest">Search Options</span>
                            <span id="searchOptionsAccordionChevron" class="material-icons text-on-surface-variant/40 text-[18px] transition-transform" style="transform: rotate(180deg)">expand_more</span>
                        </button>
                        <div id="searchOptionsAccordionContent" class="px-3 pb-4 pt-1 space-y-4">
                            <div class="flex flex-col gap-3 mt-1">
                                <label class="flex items-center gap-2 cursor-pointer group">
                                    <input type="checkbox" id="searchThisSessionOnly" onchange="window.ACP.toggleSearchSessionOptions()" class="w-3.5 h-3.5 rounded border-outline-variant/30 text-primary bg-surface-container-highest">
                                    <span class="text-[10px] font-medium text-on-surface-variant group-hover:text-on-surface">Search In Specific Session</span>
                                </label>
                                <div id="searchSessionDropdownContainer" class="hidden relative">
                                    <button id="searchSessionTrigger" onclick="window.ACP.toggleSearchSessionMenu()" 
                                        class="w-full flex items-center justify-between gap-2 py-2 px-3 rounded-lg border border-outline-variant/20 bg-surface-container-highest text-[10px] text-on-surface hover:bg-surface-container-high transition-all">
                                        <span class="truncate">Select Session</span>
                                        <span class="material-icons text-on-surface-variant text-[14px]">expand_more</span>
                                    </button>
                                    <div id="searchSessionMenu" class="hidden absolute left-0 top-full mt-1 w-full bg-surface-container-highest border border-outline-variant/20 rounded-xl shadow-2xl z-[110] max-h-40 overflow-y-auto"></div>
                                </div>
                            </div>
                            <div class="h-px bg-outline-variant/10"></div>
                            <div class="flex items-center gap-4">
                                <label class="flex items-center gap-2 cursor-pointer group"><input type="checkbox" id="searchCase" class="w-3.5 h-3.5 rounded border-outline-variant/30 text-primary bg-surface-container-highest"><span class="text-[10px] font-medium text-on-surface-variant group-hover:text-on-surface">Case Sensitive</span></label>
                                <label class="flex items-center gap-2 cursor-pointer group"><input type="checkbox" id="searchRegex" class="w-3.5 h-3.5 rounded border-outline-variant/30 text-primary bg-surface-container-highest"><span class="text-[10px] font-medium text-on-surface-variant group-hover:text-on-surface">Regex</span></label>
                            </div>
                            <div class="h-px bg-outline-variant/10"></div>
                            <div class="flex flex-col gap-2">
                                <label class="flex items-center gap-2 cursor-pointer group"><input type="checkbox" id="searchUser" checked class="w-3.5 h-3.5 rounded border-outline-variant/30 text-primary bg-surface-container-highest"><span class="text-[10px] font-medium text-on-surface-variant group-hover:text-on-surface">Include My Messages</span></label>
                                <label class="flex items-center gap-2 cursor-pointer group"><input type="checkbox" id="searchAgent" checked class="w-3.5 h-3.5 rounded border-outline-variant/30 text-primary bg-surface-container-highest"><span class="text-[10px] font-medium text-on-surface-variant group-hover:text-on-surface">Include Agent Responses</span></label>
                                <label class="flex items-center gap-2 cursor-pointer group"><input type="checkbox" id="searchThought" class="w-3.5 h-3.5 rounded border-outline-variant/30 text-primary bg-surface-container-highest"><span class="text-[10px] font-medium text-on-surface-variant group-hover:text-on-surface">Include Thoughts</span></label>
                            </div>
                            <div class="h-px bg-outline-variant/10"></div>
                            <div class="flex flex-col gap-2">
                                <label class="flex items-center gap-2 cursor-pointer group"><input type="checkbox" id="searchActive" checked class="w-3.5 h-3.5 rounded border-outline-variant/30 text-primary bg-surface-container-highest"><span class="text-[10px] font-medium text-on-surface-variant group-hover:text-on-surface">Include Active Sessions</span></label>
                                <label class="flex items-center gap-2 cursor-pointer group"><input type="checkbox" id="searchInactive" checked class="w-3.5 h-3.5 rounded border-outline-variant/30 text-primary bg-surface-container-highest"><span class="text-[10px] font-medium text-on-surface-variant group-hover:text-on-surface">Include Inactive Sessions</span></label>
                            </div>
                        </div>
                    </div>
                </div>
                <div id="searchResults" class="flex-1 overflow-y-auto p-3 space-y-3 bg-surface/50 relative z-0">
                    <div id="searchEmptyState" class="h-full flex flex-col items-center justify-center text-center p-8 opacity-40"><span class="material-icons text-4xl mb-4">manage_search</span><p class="text-xs font-medium">Ready to search</p></div>
                    <div id="searchLoadingState" class="hidden h-full flex flex-col items-center justify-center text-center p-8"><div class="w-6 h-6 border-2 border-primary/20 border-t-primary rounded-full animate-spin mb-4"></div><p class="text-xs font-medium">Searching...</p></div>
                    <div id="searchResultsList" class="hidden space-y-3"></div>

            </aside>

            <aside id="historySidebar" class="hidden w-80 bg-surface-container-lowest border-l border-outline-variant/10 flex flex-col h-full overflow-hidden shadow-xl z-20">
                <div class="p-4 border-b border-outline-variant/10 flex justify-between items-center bg-surface-container-low/50 backdrop-blur-md sticky top-0"><h3 class="font-headline font-semibold text-on-surface text-sm tracking-wide uppercase">File History</h3><button onclick="window.ACP.toggleHistory()" class="text-on-surface-variant hover:text-white"><span class="material-icons text-[18px]">close</span></button></div>
                <div id="fileHistoryContainer" class="flex-1 overflow-y-auto p-3 space-y-2"><div class="p-8 text-center text-xs text-on-surface-variant italic opacity-30">No history available</div></div>
            </aside>
        </div>
    </main>

    <script>
        // --- Shortcut Managers ---
        class ACPShortcutManager {
            constructor(acp) { this.acp = acp; }
            init() { window.addEventListener('keydown', (e) => this.handleKeydown(e)); }
            handleKeydown(e) {
                if (e.altKey && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) {
                    e.preventDefault();
                    this.navigateSession(e.key === 'ArrowUp' ? -1 : 1);
                    return;
                }
                if (e.altKey && e.code === 'KeyN') {
                    e.preventDefault(); this.acp.toggleDropdown(null); return;
                }
                const dropdown = document.getElementById('newChatDropdown');
                if (dropdown && !dropdown.classList.contains('hidden')) {
                    if (e.code === 'KeyG') {
                        e.preventDefault(); window.sendAcp('new-chat?agent=gemini'); this.acp.toggleDropdown(null, false);
                    }
                }
            }
            navigateSession(dir) {
                window.sendAcp(dir === 1 ? 'next-session' : 'prev-session');
            }
        }

        class ShortcutManager {
            constructor(acp) { this.acp = acp; }
            init() {
                const input = document.getElementById('userInput');
                if (input) input.addEventListener('keydown', (e) => this.handleInputKeydown(e));
            }
            handleInputKeydown(e) {
                const cd = document.getElementById('commandDropdown');
                const fd = document.getElementById('fileDropdown');
                const isCommandVisible = !cd.classList.contains('hidden');
                const isFileVisible = !fd.classList.contains('hidden');
                if (isCommandVisible || isFileVisible) {
                    if (e.key === 'ArrowDown') {
                        e.preventDefault(); this._navigate(isCommandVisible, 1);
                    } else if (e.key === 'ArrowUp') {
                        e.preventDefault(); this._navigate(isCommandVisible, -1);
                    } else if (e.key === 'Enter' || e.key === 'Tab') {
                        e.preventDefault(); this._confirm(isCommandVisible);
                    } else if (e.key === 'Escape') {
                        this.acp.showCommands(false); this.acp.showFiles(false);
                    }
                    return;
                }
                if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); this.acp.sendMessage(); }
            }
            _navigate(isCommand, dir) {
                if (isCommand) {
                    this.acp.selectedCommandIndex = (this.acp.selectedCommandIndex + dir + this.acp.filteredCommands.length) % this.acp.filteredCommands.length;
                    this.acp.renderCommands(this.acp.filteredCommands);
                    this.acp.scrollToActive('commandListContainer');
                } else {
                    this.acp.selectedFileIndex = (this.acp.selectedFileIndex + dir + this.acp.filteredFiles.length) % this.acp.filteredFiles.length;
                    this.acp.renderFiles(this.acp.filteredFiles);
                    this.acp.scrollToActive('fileListContainer');
                }
            }
            _confirm(isCommand) {
                if (isCommand) this.acp.applyCommand(this.acp.filteredCommands[this.acp.selectedCommandIndex].name);
                else this.acp.applyFile(this.acp.filteredFiles[this.acp.selectedFileIndex]);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const input = document.getElementById('userInput');
            if (input) {
                input.addEventListener('input', function() {
                    window.ACP.handleSlashCommand(this.innerText);
                    window.ACP.handleAtCommand(this.innerText);
                });
            }

            // Initialize Shortcut Managers
            window.acpShortcutManager = new ACPShortcutManager(window.ACP);
            window.acpShortcutManager.init();
            window.shortcutManager = new ShortcutManager(window.ACP);
            window.shortcutManager.init();

            document.addEventListener('click', (e) => {
                if (!e.target.closest('#newChatDropdown') && !e.target.closest('button[onclick*="toggleDropdown"]')) {
                    const d = document.getElementById('newChatDropdown');
                    if (d) { d.classList.add('opacity-0', 'invisible'); setTimeout(() => d.classList.add('hidden'), 200); }
                }
                if (!e.target.closest('#modelDropdown') && !e.target.closest('#modelSelectBtn')) {
                    const md = document.getElementById('modelDropdown');
                    if (md) md.classList.add('hidden');
                }
                if (!e.target.closest('#searchSessionDropdownContainer')) {
                    const ssm = document.getElementById('searchSessionMenu');
                    if (ssm) ssm.classList.add('hidden');
                }
                const link = e.target.closest('a');
                if (link && link.href && !link.href.startsWith('javascript:') && !(link.getAttribute('href') && link.getAttribute('href').startsWith('#'))) {
                    e.preventDefault(); e.stopPropagation(); window.location.href = link.href;
                }
            }, true);
        });
    </script>
