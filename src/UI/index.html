<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>ACP Agent Manager</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
    
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary-fixed-variant": "#006832", "background": "#0e0e0e", "on-secondary-container": "#bfd2e9", "on-secondary-fixed": "#2b3d4f", "secondary-fixed-dim": "#bed1e7", "on-primary-container": "#004f24", "outline": "#767575", "tertiary": "#7ae6ff", "primary-fixed": "#3fff8b", "on-tertiary-fixed": "#00343d", "on-tertiary": "#005360", "inverse-primary": "#006e35", "on-tertiary-container": "#004955", "on-error": "#490006", "inverse-on-surface": "#565555", "on-surface": "#ffffff", "surface": "#0e0e0e", "on-error-container": "#ffa8a3", "surface-container": "#1a1a1a", "primary-dim": "#24f07e", "surface-container-highest": "#262626", "secondary": "#ccdff6", "primary-fixed-dim": "#24f07e", "surface-variant": "#262626", "inverse-surface": "#fcf9f8", "on-primary": "#005d2c", "surface-container-low": "#131313", "error-dim": "#d7383b", "tertiary-fixed-dim": "#00cdec", "on-surface-variant": "#adaaaa", "error-container": "#9f0519", "surface-tint": "#3fff8b", "primary-container": "#13ea79", "outline-variant": "#484847", "on-background": "#ffffff", "error": "#ff716c", "on-tertiary-fixed-variant": "#005361", "secondary-dim": "#bed1e7", "on-secondary": "#3e5063", "surface-container-high": "#20201f", "surface-dim": "#0e0e0e", "tertiary-fixed": "#00dcfd", "secondary-fixed": "#ccdff6", "primary": "#3fff8b", "tertiary-dim": "#00cdec", "secondary-container": "#36485b", "surface-bright": "#2c2c2c", "surface-container-lowest": "#000000", "on-secondary-fixed-variant": "#485a6d", "tertiary-container": "#00dcfd", "on-primary-fixed": "#004820"
                    },
                    "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                    "fontFamily": { "headline": ["Manrope", "sans-serif"], "body": ["Inter", "sans-serif"], "label": ["Inter", "sans-serif"] }
                }
            }
        }
    </script>
    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24; }
        .material-symbols-outlined[data-weight="fill"] { font-variation-settings: 'FILL' 1, 'wght' 300, 'GRAD' 0, 'opsz' 24; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #262626; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #484847; }
        
        .markdown-body { background: transparent !important; color: #e6edf3 !important; font-family: inherit !important; font-size: 0.9375rem !important; }
        .markdown-body pre { background: #000 !important; border: 1px solid rgba(72, 72, 71, 0.5) !important; border-radius: 0.75rem !important; padding: 1rem !important; margin: 1rem 0 !important; overflow-x: auto; }
        .markdown-body code { font-family: 'JetBrains Mono', monospace !important; color: #ffffff !important; }
        .markdown-body p { margin-bottom: 1rem !important; line-height: 1.6 !important; }
        .markdown-body p:last-child { margin-bottom: 0 !important; }

        [contenteditable=true]:empty:before {
            content: attr(placeholder);
            pointer-events: none;
            color: rgba(173, 170, 170, 0.3);
            display: block;
        }

        .dropdown-header {
            padding: 12px;
            font-size: 10px;
            font-weight: 700;
            color: #adaaaa;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            border-bottom: 1px solid rgba(72, 72, 71, 0.1);
            background-color: #161616;
        }

        .cmd-item { border-bottom: 1px solid rgba(72, 72, 71, 0.05); }
        .cmd-item:last-child { border-bottom: none; }
        .cmd-item.active { background-color: rgba(63, 255, 139, 0.05); }
        .cmd-item.active .icon-box { background-color: #3fff8b; color: #000; }
        .cmd-item.active .text-highlight { color: #3fff8b; }
        .cmd-item:hover:not(.active) { background-color: rgba(255, 255, 255, 0.05); }

        /* Disable state styles */
        button:disabled {
            cursor: not-allowed !important;
            pointer-events: none !important;
            opacity: 0.2 !important;
        }
    </style>

    <script>
        window.sendAcp = function(url) {
            const finalUrl = url.replace('acp-control://', 'acp-action://').replace('http://acp-action/', 'acp-action://') + '&t=' + Date.now();
            let iframe = document.getElementById('acp-comm-frame');
            if (!iframe) {
                iframe = document.createElement('iframe'); 
                iframe.id = 'acp-comm-frame';
                iframe.style.display = 'none'; 
                document.body.appendChild(iframe);
            }
            iframe.src = finalUrl;
        };

        window.ACP = {
            lastAiMsgId: '',
            lastAiThoughtId: null,
            lastBlockType: '',
            lastMessageRole: '',
            activeSessionId: '',
            availableCommands: [],
            workspaceFiles: [],
            selectedCommandIndex: 0,
            selectedFileIndex: 0,
            filteredCommands: [],
            filteredFiles: [],
            thoughtStartTime: 0,
            accumulatedThought: '',
            
            toggleDropdown: (e, force) => {
                if (e) e.stopPropagation();
                const d = document.getElementById('newChatDropdown');
                if (!d) return;
                const isShow = (force !== undefined) ? force : (d.classList.contains('hidden'));
                if (isShow) {
                    d.classList.remove('hidden');
                    setTimeout(() => { d.classList.remove('opacity-0', 'invisible'); d.classList.add('opacity-100', 'visible'); }, 10);
                } else {
                    d.classList.add('opacity-0', 'invisible'); d.classList.remove('opacity-100', 'visible');
                    setTimeout(() => { d.classList.add('hidden'); }, 200);
                }
            },
            toggleHistory: () => {
                const sidebar = document.getElementById('historySidebar');
                if (sidebar) sidebar.classList.toggle('hidden');
            },

            sendMessage: async () => {
                const input = document.getElementById('userInput');
                const text = input.innerText.trim();
                if (text) {
                    window.sendAcp('acp-action://send-message?text=' + encodeURIComponent(JSON.stringify(text)));
                    input.innerHTML = '';
                    window.ACP.lastAiMsgId = ''; window.ACP.lastAiThoughtId = null; window.ACP.lastBlockType = ''; window.ACP.lastMessageRole = '';
                    window.ACP.accumulatedThought = '';
                }
            },

            resumeSession: () => {
                window.ACP.clearChat(); 
                window.sendAcp('acp-action://resume-session?id=' + window.ACP.activeSessionId);
            },

            addMessageToUI: (role, text) => {
                const container = document.getElementById('mainChatCanvasInner');
                const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                const id = 'msg-' + Date.now() + Math.random().toString(36).substr(2, 5);
                
                let html = role === 'me' ? `
                    <div class="flex flex-col items-end gap-1.5 max-w-3xl ml-auto">
                        <div class="bg-secondary-container text-on-surface px-5 py-3.5 rounded-2xl rounded-tr-sm shadow-xl shadow-black/20 border border-white/5">
                            <p id="${id}" class="text-sm font-body leading-relaxed">${text}</p>
                        </div>
                        <div class="flex items-center gap-2 mr-1">
                            <span class="text-[11px] text-on-surface-variant font-medium">${time}</span>
                            <span class="material-symbols-outlined text-[14px] text-on-surface-variant">check_circle</span>
                        </div>
                    </div>` : `
                    <div class="flex flex-col items-start gap-1.5 max-w-3xl mr-auto group">
                        <div class="flex items-center gap-3 mb-1 ml-1 opacity-0 group-hover:opacity-100 transition-opacity">
                            <span class="text-[11px] font-headline font-semibold text-primary">Gemini-CLI</span>
                            <span class="text-[11px] text-on-surface-variant font-medium">${time}</span>
                        </div>
                        <div class="bg-surface-container-highest text-on-surface px-5 py-4 rounded-2xl rounded-tl-sm shadow-xl shadow-black/20 border border-outline-variant/10 w-full">
                            <div id="${id}" class="markdown-body min-h-[1.5rem]"></div>
                        </div>
                    </div>`;
                container.insertAdjacentHTML('beforeend', html);
                const outer = document.getElementById('mainChatCanvas');
                outer.scrollTop = outer.scrollHeight;
                return id;
            },

            createThoughtContainer: () => {
                const container = document.getElementById('mainChatCanvasInner');
                const id = 'thought-' + Date.now();
                const hdrId = 'thought-hdr-' + Date.now();
                window.ACP.thoughtStartTime = Date.now();
                
                const html = `
                    <div class="flex justify-start">
                        <div class="w-full max-w-3xl flex flex-col space-y-2">
                            <div id="${hdrId}" class="flex items-center space-x-2 text-xs text-gray-500 dark:text-text-muted cursor-pointer hover:text-gray-700 dark:hover:text-gray-300 transition-colors select-none w-max group py-1">
                                <span class="material-icons text-sm text-primary">psychology</span>
                                <span class="font-medium">Thinking...</span>
                                <span class="material-icons text-sm">expand_more</span>
                            </div>
                            <div id="${id}" class="pl-5 border-l border-gray-200 dark:border-border-dark ml-2 space-y-2 hidden">
                            </div>
                        </div>
                    </div>`;
                container.insertAdjacentHTML('beforeend', html);
                const outer = document.getElementById('mainChatCanvas');
                outer.scrollTop = outer.scrollHeight;
                return { contentId: id, headerId: hdrId };
            },

            parseAndRenderThought: (text, containerId) => {
                const div = document.getElementById(containerId);
                if (!div) return;
                const parts = text.split(/\*\*([^*]+)\*\*/g);
                let html = '';
                if (parts[0] && parts[0].trim()) {
                    html += `<div class="text-[11px] text-gray-500 dark:text-text-muted/60 mb-2 italic px-1">${marked.parseInline(parts[0])}</div>`;
                }
                for (let i = 1; i < parts.length; i += 2) {
                    const subject = parts[i].trim();
                    const content = parts[i+1] ? parts[i+1].trim() : '';
                    html += `
                        <div class="flex flex-col space-y-1 mb-2.5 last:mb-0">
                            <div class="flex items-center space-x-2 text-xs text-gray-500 dark:text-text-muted">
                                <span class="material-icons text-[14px]">check</span>
                                <span class="font-medium">${subject}</span>
                            </div>
                            ${content ? `<div class="pl-5 text-[11px] text-gray-500/70 dark:text-text-muted/60 leading-relaxed markdown-body !bg-transparent !p-0 !m-0 border-none shadow-none opacity-80">${marked.parse(content)}</div>` : ''}
                        </div>`;
                }
                div.innerHTML = html;
            },

            finalizeThought: () => {
                if (window.ACP.lastAiThoughtId) {
                    const hdr = document.getElementById(window.ACP.lastAiThoughtId.headerId);
                    const cnt = document.getElementById(window.ACP.lastAiThoughtId.contentId);
                    if (hdr) {
                        const duration = Math.round((Date.now() - window.ACP.thoughtStartTime) / 1000);
                        hdr.classList.remove('py-1');
                        hdr.classList.add('py-1.5');
                        hdr.querySelector('.material-icons').classList.remove('text-primary');
                        hdr.querySelector('.material-icons').classList.add('text-gray-400', 'dark:text-gray-500');
                        hdr.querySelector('.font-medium').innerText = `Thought Process (${duration}s)`;
                        
                        const arrow = hdr.querySelector('.material-icons:last-child');
                        if (arrow) arrow.innerText = 'expand_more';
                        
                        // Set to collapsed by default
                        if (cnt) cnt.classList.add('hidden');
                        
                        hdr.onclick = () => {
                            const isHidden = cnt.classList.contains('hidden');
                            cnt.classList.toggle('hidden');
                            if (arrow) arrow.innerText = isHidden ? 'expand_less' : 'expand_more';
                        };
                    }
                }
            },

            updateSessionList: (data) => {
                const sessions = typeof data === 'string' ? JSON.parse(data) : data;
                const container = document.getElementById('sessionListContainer');
                const sendBtn = document.getElementById('send-button');
                const userInput = document.getElementById('userInput');
                const modelSelectBtn = document.getElementById('modelSelectBtn');
                const attachBtn = document.getElementById('attachBtn');
                const toolsBtn = document.getElementById('toolsBtn');
                
                let activeSession = sessions.find(s => s.active);
                if (activeSession) {
                    if (window.ACP.activeSessionId !== activeSession.id) {
                        window.ACP.activeSessionId = activeSession.id;
                        document.getElementById('mainChatCanvasInner').innerHTML = '';
                    }
                    document.getElementById('activeAgentHeader').innerText = activeSession.name;
                    document.getElementById('mainInputArea').classList.remove('hidden');
                    document.getElementById('mainChatCanvas').classList.remove('hidden');
                    document.getElementById('mainEmptyArea').classList.add('hidden');

                    const isOffline = !activeSession.online && !activeSession.loading;
                    const isLoading = activeSession.loading;

                    const setDisabled = (val) => {
                        if (modelSelectBtn) modelSelectBtn.disabled = val;
                        if (attachBtn) attachBtn.disabled = val;
                        if (toolsBtn) toolsBtn.disabled = val;
                    };

                    if (isLoading) {
                        sendBtn.innerHTML = `<span class="material-symbols-outlined text-[20px] animate-spin">refresh</span>`;
                        sendBtn.onclick = null;
                        userInput.setAttribute('contenteditable', 'false');
                        setDisabled(true);
                    } else if (isOffline) {
                        sendBtn.innerHTML = `<span class="material-symbols-outlined text-[20px]">autorenew</span>`;
                        sendBtn.onclick = () => window.ACP.resumeSession();
                        userInput.setAttribute('contenteditable', 'false');
                        setDisabled(true);
                    } else {
                        sendBtn.innerHTML = `<span class="material-symbols-outlined text-[20px]">send</span>`;
                        sendBtn.onclick = () => window.ACP.sendMessage();
                        userInput.setAttribute('contenteditable', 'true');
                        setDisabled(false);
                    }

                    if (activeSession.models && modelSelectBtn) {
                        const currentModelId = activeSession.models.currentModelId || '';
                        let currentModelLabel = currentModelId;
                        
                        const dropdown = document.getElementById('modelDropdown');
                        if (dropdown && activeSession.models.availableModels) {
                            dropdown.innerHTML = '<div class="dropdown-header">AVAILABLE MODELS</div>';
                            activeSession.models.availableModels.forEach(m => {
                                const mId = typeof m === 'string' ? m : m.modelId;
                                const mName = typeof m === 'string' ? m : (m.name || m.modelId);
                                const mDesc = typeof m === 'object' ? m.description : '';
                                const isActive = mId === currentModelId;
                                if (isActive) currentModelLabel = mName;
                                
                                dropdown.innerHTML += `
                                    <button onclick="window.sendAcp('acp-action://change-model?modelId=${mId}'); document.getElementById('modelDropdown').classList.add('hidden');"
                                        class="cmd-item w-full text-left px-5 py-3 transition-colors flex items-center justify-between">
                                        <div class="flex flex-col min-w-0">
                                            <span class="text-sm font-bold ${isActive ? 'text-primary' : 'text-on-surface'}">${mName}</span>
                                            ${mDesc ? `<span class="text-[10px] text-on-surface-variant/60 truncate mt-0.5">${mDesc}</span>` : ''}
                                        </div>
                                        ${isActive ? '<span class="material-icons text-primary text-sm">check</span>' : ''}
                                    </button>
                                `;
                            });
                        }
                        modelSelectBtn.querySelector('span:nth-child(2)').innerText = currentModelLabel || 'Select Model';
                        modelSelectBtn.querySelector('span:nth-child(2)').className = 'text-on-surface font-medium';
                    }
                }

                container.innerHTML = sessions.map(s => `
                    <div onclick="window.sendAcp('acp-action://select-session?id=${s.id}')" 
                        class="flex items-center gap-3 px-3 py-2.5 rounded-lg cursor-pointer group relative overflow-hidden ${s.active ? 'bg-surface-container-high border-l-[3px] border-primary' : 'hover:bg-surface-container-high/50 text-on-surface-variant hover:text-on-surface border-l-[3px] border-transparent'}">
                        <div class="relative z-10">
                            <div class="w-9 h-9 rounded-full bg-surface-container flex items-center justify-center border border-outline-variant/20">
                                <span class="material-icons text-lg ${s.active ? 'text-primary' : ''}">${s.active ? 'forum' : 'chat_bubble_outline'}</span>
                            </div>
                            <div class="absolute -bottom-0.5 -right-0.5 w-3 h-3 ${s.online ? 'bg-primary' : 'bg-gray-400'} rounded-full border-2 border-surface-container-lowest"></div>
                        </div>
                        <div class="flex-1 min-w-0 z-10">
                            <div class="text-sm font-headline ${s.active ? 'font-semibold text-primary' : 'font-medium'} truncate">${s.name}</div>
                            <div class="text-xs ${s.active ? 'text-on-surface-variant' : 'opacity-60'} truncate">${s.workspace || ''}</div>
                        </div>
                        <span class="material-symbols-outlined text-on-surface-variant text-[16px] z-10 ${s.pinned ? 'opacity-100' : 'opacity-0 group-hover:opacity-100'}" data-weight="fill">push_pin</span>
                    </div>`).join('');
            },

            streamThought: (data) => {
                if (window.ACP.lastBlockType !== 'thought') {
                    window.ACP.lastAiThoughtId = window.ACP.createThoughtContainer();
                    window.ACP.lastBlockType = 'thought';
                    window.ACP.accumulatedThought = '';
                }
                window.ACP.accumulatedThought += data.content;
                window.ACP.parseAndRenderThought(window.ACP.accumulatedThought, window.ACP.lastAiThoughtId.contentId);
                const div = document.getElementById(window.ACP.lastAiThoughtId.contentId);
                if (div) div.classList.remove('hidden'); 
                
                const outer = document.getElementById('mainChatCanvas');
                outer.scrollTop = outer.scrollHeight;
            },

            streamMessage: (data) => {
                const { content, role } = data;
                const targetRole = role === 'user' ? 'me' : 'ai';
                
                if (window.ACP.lastBlockType === 'thought') {
                    window.ACP.finalizeThought();
                }

                if (window.ACP.lastBlockType !== 'message' || window.ACP.lastMessageRole !== targetRole) {
                    window.ACP.lastAiMsgId = window.ACP.addMessageToUI(targetRole, '');
                    window.ACP.lastBlockType = 'message';
                    window.ACP.lastMessageRole = targetRole;
                }

                const targetDiv = document.getElementById(window.ACP.lastAiMsgId);
                if (targetDiv) {
                    if (targetRole === 'ai') {
                        if (window.marked) targetDiv.innerHTML = marked.parse(content);
                        else targetDiv.innerText = content;
                    } else {
                        targetDiv.innerText = content;
                    }
                }
                const outer = document.getElementById('mainChatCanvas');
                outer.scrollTop = outer.scrollHeight;
            },

            loadHistoryBase64: (base64) => {
                try {
                    const binary = window.atob(base64);
                    const bytes = new Uint8Array(binary.length);
                    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
                    const json = new TextDecoder().decode(bytes);
                    const data = JSON.parse(json);
                    
                    document.getElementById('mainChatCanvasInner').innerHTML = `
                        <div class="flex justify-center">
                            <span class="px-3 py-1 text-[11px] font-medium tracking-wider text-on-surface-variant uppercase bg-surface-container rounded-full border border-outline-variant/10">Today</span>
                        </div>`;
                    window.ACP.lastMessageRole = ''; window.ACP.lastBlockType = '';

                    data.forEach(msg => {
                        const r = msg.role;
                        if (r === 'thought') {
                            const tIds = window.ACP.createThoughtContainer();
                            window.ACP.lastBlockType = 'thought';
                            window.ACP.accumulatedThought = msg.content;
                            window.ACP.lastAiThoughtId = tIds;
                            window.ACP.parseAndRenderThought(msg.content, tIds.contentId);
                            window.ACP.finalizeThought();
                        } else {
                            window.ACP.streamMessage({content: msg.content, role: r});
                        }
                    });
                } catch (e) { console.error('History load error:', e); }
            },

            clearChat: () => {
                document.getElementById('mainChatCanvasInner').innerHTML = '';
                window.ACP.lastAiMsgId = ''; window.ACP.lastAiThoughtId = null; window.ACP.lastBlockType = ''; window.ACP.lastMessageRole = '';
            },

            // Mention & Command Logic
            getTriggerInfo: (text, trigger) => {
                const selection = window.getSelection();
                if (!selection.rangeCount) return null;
                const range = selection.getRangeAt(0);
                const content = range.startContainer.textContent || "";
                const beforeCursor = content.substring(0, range.startOffset);
                const words = beforeCursor.split(/[\s\xa0\n]/);
                const lastWord = words[words.length - 1];
                if (lastWord.startsWith(trigger)) return lastWord.slice(1).toLowerCase();
                return null;
            },

            replaceTriggerRange: (trigger, replacementNodeOrText) => {
                const selection = window.getSelection();
                if (!selection.rangeCount) return;
                const range = selection.getRangeAt(0);
                const node = range.startContainer;
                const text = node.textContent || "";
                const beforeCursor = text.substring(0, range.startOffset);
                const words = beforeCursor.split(/[\s\xa0\n]/);
                const lastWord = words[words.length - 1];

                if (lastWord.startsWith(trigger)) {
                    range.setStart(node, range.startOffset - lastWord.length);
                    range.setEnd(node, range.startOffset);
                    range.deleteContents();
                    const inserted = (typeof replacementNodeOrText === 'string') ? document.createTextNode(replacementNodeOrText) : replacementNodeOrText;
                    range.insertNode(inserted);
                    range.setStartAfter(inserted);
                    const space = document.createTextNode('\u00A0');
                    range.insertNode(space);
                    range.setStartAfter(space);
                    range.collapse(true);
                    selection.removeAllRanges(); selection.addRange(range);
                }
            },

            handleSlashCommand: (text) => {
                const query = window.ACP.getTriggerInfo(text, '/');
                if (query !== null) {
                    const filtered = (window.ACP.availableCommands || []).filter(c => query === "" || c.name.toLowerCase().includes(query));
                    if (filtered.length > 0) {
                        window.ACP.filteredCommands = filtered;
                        window.ACP.selectedCommandIndex = 0;
                        window.ACP.renderCommands(filtered);
                        window.ACP.showCommands(true);
                        return;
                    }
                }
                window.ACP.showCommands(false);
            },

            handleAtCommand: (text) => {
                const query = window.ACP.getTriggerInfo(text, '@');
                if (query !== null) {
                    const filtered = (window.ACP.workspaceFiles || []).filter(f => query === "" || f.toLowerCase().includes(query)).slice(0, 20);
                    if (filtered.length > 0) {
                        window.ACP.filteredFiles = filtered;
                        window.ACP.selectedFileIndex = 0;
                        window.ACP.renderFiles(filtered);
                        window.ACP.showFiles(true);
                        return;
                    }
                }
                window.ACP.showFiles(false);
            },

            renderCommands: (commands) => {
                const container = document.getElementById('commandListContainer');
                if (!container) return;
                container.innerHTML = '<div class="dropdown-header">COMMANDS</div>';
                container.innerHTML += commands.map((c, i) => `
                    <div onmousedown="event.preventDefault(); window.ACP.applyCommand('${c.name}')"
                        class="cmd-item w-full flex items-center gap-4 px-5 py-3.5 cursor-pointer transition-colors ${i === window.ACP.selectedCommandIndex ? 'active' : ''}">
                        <div class="icon-box w-7 h-7 rounded bg-surface-container flex items-center justify-center transition-colors">
                            <span class="material-icons text-sm">terminal</span>
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="text-sm font-bold font-mono text-highlight">/${c.name}</div>
                            ${c.description ? `<div class="text-[11px] text-on-surface-variant/60 truncate mt-0.5">${c.description}</div>` : ''}
                        </div>
                    </div>`).join('');
            },

            renderFiles: (files) => {
                const container = document.getElementById('fileListContainer');
                if (!container) return;
                container.innerHTML = '<div class="dropdown-header">WORKSPACE FILES</div>';
                container.innerHTML += files.map((f, i) => `
                    <div onmousedown="event.preventDefault(); window.ACP.applyFile('${f}')"
                        class="cmd-item w-full flex items-center gap-4 px-5 py-3 cursor-pointer transition-colors ${i === window.ACP.selectedFileIndex ? 'active' : ''}">
                        <span class="material-icons text-sm ${i === window.ACP.selectedFileIndex ? 'text-primary' : 'text-on-surface-variant/40'}">description</span>
                        <span class="text-xs font-mono truncate text-highlight">${f}</span>
                    </div>`).join('');
            },

            showCommands: (show) => { document.getElementById('commandDropdown').classList.toggle('hidden', !show); },
            showFiles: (show) => { document.getElementById('fileDropdown').classList.toggle('hidden', !show); },
            applyCommand: (name) => { window.ACP.replaceTriggerRange('/', '/' + name); window.ACP.showCommands(false); },
            applyFile: (path) => { 
                const pill = document.createElement('span');
                pill.className = 'text-primary font-medium px-1.5 py-0.5 bg-primary/10 rounded mx-0.5';
                pill.contentEditable = 'false'; pill.innerText = `@${path}`;
                window.ACP.replaceTriggerRange('@', pill); window.ACP.showFiles(false);
            },
            setWorkspaceFiles: (files) => { window.ACP.workspaceFiles = files; },
            showTyping: (show) => { /* send-button handles this */ },
            parseStructuredPrompt: async (text) => { return text; }
        };
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.2.0/github-markdown-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
</head>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const input = document.getElementById('userInput');
            if (input) {
                input.addEventListener('input', function() {
                    window.ACP.handleSlashCommand(this.innerText);
                    window.ACP.handleAtCommand(this.innerText);
                });
                input.addEventListener('keydown', (e) => {
                    const cd = document.getElementById('commandDropdown');
                    const fd = document.getElementById('fileDropdown');
                    const isCommandVisible = !cd.classList.contains('hidden');
                    const isFileVisible = !fd.classList.contains('hidden');

                    if (isCommandVisible || isFileVisible) {
                        if (e.key === 'ArrowDown') {
                            e.preventDefault();
                            if (isCommandVisible) {
                                window.ACP.selectedCommandIndex = (window.ACP.selectedCommandIndex + 1) % window.ACP.filteredCommands.length;
                                window.ACP.renderCommands(window.ACP.filteredCommands);
                            } else {
                                window.ACP.selectedFileIndex = (window.ACP.selectedFileIndex + 1) % window.ACP.filteredFiles.length;
                                window.ACP.renderFiles(window.ACP.filteredFiles);
                            }
                        } else if (e.key === 'ArrowUp') {
                            e.preventDefault();
                            if (isCommandVisible) {
                                window.ACP.selectedCommandIndex = (window.ACP.selectedCommandIndex - 1 + window.ACP.filteredCommands.length) % window.ACP.filteredCommands.length;
                                window.ACP.renderCommands(window.ACP.filteredCommands);
                            } else {
                                window.ACP.selectedFileIndex = (window.ACP.selectedFileIndex - 1 + window.ACP.filteredFiles.length) % window.ACP.filteredFiles.length;
                                window.ACP.renderFiles(window.ACP.filteredFiles);
                            }
                        } else if (e.key === 'Enter' || e.key === 'Tab') {
                            e.preventDefault();
                            if (isCommandVisible) {
                                window.ACP.applyCommand(window.ACP.filteredCommands[window.ACP.selectedCommandIndex].name);
                            } else {
                                window.ACP.applyFile(window.ACP.filteredFiles[window.ACP.selectedFileIndex]);
                            }
                        } else if (e.key === 'Escape') {
                            window.ACP.showCommands(false); window.ACP.showFiles(false);
                        }
                        return;
                    }

                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        window.ACP.sendMessage();
                    }
                });
            }
            document.addEventListener('click', (e) => {
                if (!e.target.closest('#newChatDropdown') && !e.target.closest('button[onclick*="toggleDropdown"]')) {
                    const d = document.getElementById('newChatDropdown');
                    if (d) { d.classList.add('opacity-0', 'invisible'); setTimeout(() => d.classList.add('hidden'), 200); }
                }
                if (!e.target.closest('#modelDropdown') && !e.target.closest('#modelSelectBtn')) {
                    const md = document.getElementById('modelDropdown');
                    if (md) md.classList.add('hidden');
                }
            });
        });
    </script>
